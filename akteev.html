<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Akteev – KTE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --side:#17233A;--side2:#1F2E4A;--sideTxt:#AEB9CC;--accent:#2F6FED;--accentL:#E8F0FE;--kte:#2B4C7E;
  --bg:#F3F5F9;--card:#fff;--txt:#1C2433;--mut:#6B7385;--trait:#E3E7EE;--hover:#F6F8FB;
  --ok:#16A34A;--warn:#D97706;--err:#DC2626;--r:10px;--sh:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08)
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--txt);background:var(--bg);display:flex}
a{color:var(--accent);text-decoration:none}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
/* ---------- Menu gauche ---------- */
#side{width:232px;flex:none;background:var(--side);color:var(--sideTxt);display:flex;flex-direction:column;height:100vh;position:sticky;top:0;overflow-y:auto}
#side .marque{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;color:#fff;font-weight:700;font-size:17px;letter-spacing:.2px}
#side .marque span.k{display:grid;place-items:center;width:32px;height:32px;border-radius:8px;background:var(--accent);font-size:15px}
#side .marque small{display:block;font-weight:500;font-size:11px;color:var(--sideTxt);letter-spacing:0}
#side .grp{padding:14px 18px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:#6F7D96;font-weight:600}
#side a.it{display:flex;align-items:center;gap:11px;margin:1px 10px;padding:8px 10px;border-radius:8px;color:var(--sideTxt);font-weight:500;position:relative}
#side a.it:hover{background:var(--side2);color:#fff}
#side a.it.on{background:var(--accent);color:#fff}
#side a.it svg{width:18px;height:18px;flex:none;opacity:.9}
#side a.it .nb:empty{display:none}
#side a.it .nb{margin-left:auto;font-size:11px;background:rgba(255,255,255,.12);padding:1px 7px;border-radius:10px}
#side a.it.on .nb{background:rgba(255,255,255,.25)}
#side .bas{margin-top:auto;padding:14px 18px;border-top:1px solid #26354F;font-size:12px}
#side .bas select{width:100%;margin-top:5px;background:var(--side2);border:1px solid #2C3D5C;color:#fff;border-radius:6px;padding:5px}
#side .bas a{color:var(--sideTxt);display:block;margin-top:8px}
#side .bas a:hover{color:#fff}
/* ---------- Zone principale ---------- */
#wrap{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh;overflow:hidden}
#top{height:58px;flex:none;background:#fff;border-bottom:1px solid var(--trait);display:flex;align-items:center;gap:14px;padding:0 24px}
#top .burger{display:none;border:0;background:none;padding:4px}
#gsearch{position:relative;flex:1;max-width:520px}
#gsearch input{width:100%;border:1px solid var(--trait);background:var(--bg);border-radius:8px;padding:8px 12px 8px 34px;outline:none}
#gsearch input:focus{border-color:var(--accent);background:#fff}
#gsearch svg{position:absolute;left:10px;top:9px;width:16px;height:16px;color:var(--mut)}
#gres{position:absolute;top:40px;left:0;right:0;background:#fff;border:1px solid var(--trait);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);max-height:420px;overflow:auto;display:none;z-index:50}
#gres a{display:flex;gap:10px;padding:8px 12px;color:var(--txt);border-bottom:1px solid var(--hover)}
#gres a:hover,#gres a.sel{background:var(--accentL)}
#gres .ty{font-size:11px;color:var(--mut);width:90px;flex:none;padding-top:1px}
#top .droite{margin-left:auto;display:flex;align-items:center;gap:10px;color:var(--mut);font-size:12px}
#main{flex:1;overflow:auto;padding:22px 26px 60px}
/* ---------- Éléments communs ---------- */
h1{font-size:21px;margin:0;font-weight:700}
.entete{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.entete .sous{color:var(--mut);font-size:13px}
.entete .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--trait);background:#fff;border-radius:8px;padding:7px 13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;color:var(--txt);white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.p{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.p:hover{filter:brightness(.95)}
.btn.d{color:var(--err)}
.btn.vert{background:#DCFCE7;border-color:#86EFAC;color:#166534}
.btn.vert:hover{background:#BBF7D0}
.ic16 svg{width:16px;height:16px;flex:none}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:15px;height:15px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid #EAEDF2}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:500;white-space:nowrap;line-height:18px}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
.chip svg{width:13px;height:13px;vertical-align:-2px;margin-right:3px;color:var(--accent)}
.chip{display:inline-block;background:#EEF1F6;border-radius:5px;padding:1px 7px;margin:1px 3px 1px 0;font-size:12.5px;color:var(--txt);white-space:nowrap}
a.chip:hover{background:var(--accentL);color:var(--accent)}
.mut{color:var(--mut)}
.retard{color:var(--err);font-weight:600}
.vide{padding:40px;text-align:center;color:var(--mut)}
/* ---------- Barre d'outils de liste ---------- */
.outils{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--trait)}
.outils .rech{position:relative}
.outils .rech input{border:1px solid var(--trait);border-radius:7px;padding:6px 10px 6px 30px;width:240px;outline:none}
.outils .rech input:focus{border-color:var(--accent)}
.outils .rech svg{position:absolute;left:9px;top:8px;width:14px;height:14px;color:var(--mut)}
.outils select{border:1px solid var(--trait);border-radius:7px;padding:6px 8px;background:#fff;max-width:220px}
.puces{display:flex;gap:6px;flex-wrap:wrap}
.puce{border:1px solid var(--trait);background:#fff;border-radius:20px;padding:4px 11px;font-size:12.5px;color:var(--mut)}
.puce b{font-weight:600;color:var(--txt);margin-left:3px}
.puce.on{background:var(--accentL);border-color:#B8CDF8;color:var(--accent)}
.puce.on b{color:var(--accent)}
.bascule{display:inline-flex;border:1px solid var(--trait);border-radius:7px;overflow:hidden;margin-left:auto}
.bascule button{border:0;background:#fff;padding:6px 10px;color:var(--mut);display:flex;align-items:center;gap:5px}
.bascule button.on{background:var(--accentL);color:var(--accent)}
.bascule svg{width:15px;height:15px}
/* ---------- Tableaux ---------- */
.tw{overflow-x:auto}
table.l{width:100%;border-collapse:collapse}
table.l th{text-align:left;font-size:12px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.3px;padding:9px 12px;border-bottom:1px solid var(--trait);white-space:nowrap;cursor:pointer;user-select:none;background:#FAFBFC;position:sticky;top:0}
table.l th:hover{color:var(--txt)}
table.l th .fl{opacity:.6;font-size:10px}
table.l tr.filtres th{position:static;background:#fff;padding:5px 6px;cursor:default;text-transform:none;letter-spacing:0;font-weight:400}
table.l tr.filtres input,table.l tr.filtres select{width:100%;min-width:70px;border:1px solid var(--trait);border-radius:6px;padding:4px 7px;font-size:12.5px;background:#fff;outline:none;color:var(--txt)}
table.l tr.filtres input:focus,table.l tr.filtres select:focus{border-color:var(--accent)}
table.l tr.filtres .on{border-color:#B8CDF8;background:var(--accentL)}
table.l td{padding:9px 12px;border-bottom:1px solid #EFF1F5;vertical-align:middle;max-width:340px;overflow:hidden;text-overflow:ellipsis}
table.l tbody tr{cursor:pointer}
table.l tbody tr:hover{background:var(--hover)}
table.l td.n,table.l th.n{text-align:right;white-space:nowrap}
table.l td.prim{font-weight:600;color:var(--kte);white-space:nowrap}
table.l tfoot td{font-weight:600;padding:10px 12px;background:#FAFBFC}
.plus{padding:12px;text-align:center}
/* ---------- Kanban ---------- */
.kanban{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.kcol{flex:0 0 272px;background:#EBEEF3;border-radius:var(--r);padding:10px;min-height:120px}
.kcol.over{outline:2px dashed var(--accent);outline-offset:-2px}
.kcol h3{margin:2px 4px 10px;font-size:13px;display:flex;align-items:center;gap:8px}
.kcol h3 .nb{margin-left:auto;color:var(--mut);font-weight:500}
.kcard{background:#fff;border-radius:8px;padding:10px 11px;margin-bottom:8px;box-shadow:var(--sh);cursor:grab;border-left:3px solid transparent}
.kcard:hover{box-shadow:0 2px 8px rgba(0,0,0,.12)}
.kcard .t{font-weight:600;font-size:13px;margin-bottom:4px}
.kcard .m{font-size:12px;color:var(--mut);display:flex;gap:8px;flex-wrap:wrap}
/* ---------- Tableau de bord ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:16px}
.kpi{padding:16px 18px;cursor:pointer}
.kpi:hover{box-shadow:0 2px 10px rgba(0,0,0,.1)}
.kpi .lab{color:var(--mut);font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:7px}
.kpi .lab svg{width:16px;height:16px}
.kpi .val{font-size:26px;font-weight:700;margin-top:6px;letter-spacing:-.5px}
.kpi .det{font-size:12.5px;color:var(--mut);margin-top:2px}
.grille{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr));gap:16px}
.bloc h2{font-size:14.5px;margin:0;padding:14px 16px;border-bottom:1px solid var(--trait);display:flex;align-items:center;gap:8px}
.bloc h2 a{margin-left:auto;font-size:12.5px;font-weight:500}
.ligneDb{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid #F0F2F6;cursor:pointer}
.ligneDb:hover{background:var(--hover)}
tr[data-ax]{cursor:pointer}tr[data-ax].sel td{background:#E8F0FE;font-weight:600}
.ligneDb .x{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ligneDb .x small{color:var(--mut);margin-left:6px}
/* ---------- Fiche ---------- */
.fiche{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.form{padding:6px 20px 18px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 22px}
.form .ch{padding:9px 0;border-bottom:1px solid #F0F2F6;min-width:0}
.form .ch.plein{grid-column:1/-1}
.form .ch label{display:block;font-size:12px;color:var(--mut);font-weight:500;margin-bottom:4px}
.form .ch label .req{color:var(--err)}
.form .ch .ro{min-height:22px;word-wrap:break-word;white-space:pre-wrap}
.ed{width:100%;border:1px solid transparent;border-radius:6px;padding:5px 7px;margin-left:-7px;background:transparent;outline:none;min-height:32px}
.ed:hover{border-color:var(--trait);background:#fff}
.ed:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accentL)}
textarea.ed{resize:vertical;min-height:60px}
.ed.modif{background:#FFF8E6;border-color:#F5D58A}
.dtw{display:flex;align-items:center;gap:2px;position:relative}
.dtw .ed{flex:1;min-width:0}
.dtw .cal{border:0;background:none;color:var(--mut);padding:4px;display:flex}
.dtw .cal:hover{color:var(--accent)}
.dtw .cal svg{width:17px;height:17px}
.dtw .dtn{position:absolute;right:0;bottom:0;width:1px;height:1px;opacity:0;border:0;padding:0;pointer-events:none}
.ed.invalide{border-color:var(--err)!important;background:#FEF2F2}
.lienEd{display:flex;flex-wrap:wrap;align-items:center;gap:3px;min-height:32px;padding:4px 0}
.lienEd .chip .x{margin-left:5px;color:var(--mut);cursor:pointer}
.lienEd .chip .x:hover{color:var(--err)}
.lienEd button{border:1px dashed var(--trait);background:#fff;border-radius:5px;padding:1px 8px;color:var(--mut);font-size:12px}
.lienEd button:hover{border-color:var(--accent);color:var(--accent)}
.lienEd.modif{background:#FFF8E6;border-radius:6px}
.section{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);font-weight:600;padding:16px 20px 4px;grid-column:1/-1}
details.calc summary{cursor:pointer;padding:12px 20px;color:var(--mut);font-size:13px;font-weight:500}
.cote .card{margin-bottom:14px}
.cote .card h3{font-size:13px;margin:0;padding:12px 14px;border-bottom:1px solid var(--trait)}
.cote .card .c{padding:10px 14px;font-size:13px}
.cote .lien{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid #F0F2F6;color:var(--txt)}
.cote .lien:hover{background:var(--hover)}
.cote .lien svg{width:16px;height:16px;color:var(--accent)}
.onglets{display:flex;gap:2px;border-bottom:1px solid var(--trait);padding:0 12px;overflow-x:auto}
.onglets button{border:0;background:none;padding:11px 12px;color:var(--mut);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.onglets button.on{color:var(--accent);border-bottom-color:var(--accent)}
.onglets button .nb{background:#EEF1F6;border-radius:10px;padding:0 6px;font-size:11px;margin-left:4px}
#barreEnr{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(200px);background:var(--side);color:#fff;border-radius:10px;padding:10px 12px 10px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:transform .2s;z-index:40}
#barreEnr.vis{transform:translateX(-50%) translateY(0)}
#barreEnr .btn{border-color:#3A4B6A;background:transparent;color:#fff}
#barreEnr .btn.p{background:var(--accent);border-color:var(--accent)}
.selStatut{position:relative;display:inline-block}
.selStatut select{position:absolute;inset:0;opacity:0;cursor:pointer}
/* ---------- Fenêtres ---------- */
#modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:flex-start;justify-content:center;padding-top:8vh;z-index:60}
#modal .box{background:#fff;border-radius:12px;width:min(640px,94vw);max-height:80vh;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.3)}
table.cmp td.cmpMin{background:#DCFCE7;color:#15803D;font-weight:700}
table.cmp td.cmpMax{background:#FEF2F2;color:#B91C1C}
table.cmp td.cmpRet{box-shadow:inset 0 0 0 2px #16A34A}
table.cmp .cmpEc{font-size:11px;color:var(--mut);font-weight:400}
table.cmp tfoot td{border-top:2px solid var(--trait);vertical-align:top;padding-top:8px}
.btn.mini{padding:2px 8px;font-size:11.5px;margin-top:4px;min-height:0;height:auto}
table.cmp th.cmpPV,table.cmp td.cmpPV{background:#FFF1DE}
table.cmp td.cmpPV input{width:96px;text-align:right;border:1px solid #F3C98B;border-radius:6px;padding:4px 6px;font:inherit;background:#fff}
table.cmp td.cmpPV input:focus{outline:2px solid #F59E0B;border-color:#F59E0B}
.cmpOutils{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#FFF1DE;border:1px solid #F3C98B;border-radius:8px;padding:8px 10px;margin-bottom:10px;font-size:13px}
.cmpOutils input,.cmpOutils select{font:inherit;border:1px solid #F3C98B;border-radius:6px;padding:3px 6px;background:#fff}
.cmpOutils .btn.mini{margin-top:0}
#modal .box h3{margin:0;padding:16px 18px;border-bottom:1px solid var(--trait);font-size:15px;display:flex;align-items:center}
#modal .box h3 button{margin-left:auto;border:0;background:none;font-size:20px;color:var(--mut)}
#modal .box .corps{padding:14px 18px;overflow:auto;flex:1}
#modal .box .pied{padding:12px 18px;border-top:1px solid var(--trait);display:flex;justify-content:flex-end;gap:8px}
.choixL{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:6px;cursor:pointer}
.choixL:hover{background:var(--hover)}
.choixL small{color:var(--mut)}
#toast{position:fixed;right:20px;bottom:20px;z-index:70;display:flex;flex-direction:column;gap:8px}
#toast div{background:#fff;border-left:4px solid var(--ok);box-shadow:0 6px 20px rgba(0,0,0,.15);border-radius:8px;padding:10px 14px;min-width:240px;max-width:420px;animation:entre .2s}
#toast div.err{border-left-color:var(--err)}
@keyframes entre{from{opacity:0;transform:translateX(20px)}}
.charge{display:flex;align-items:center;gap:10px;color:var(--mut);padding:40px;justify-content:center}
.charge::before{content:"";width:18px;height:18px;border:2px solid var(--trait);border-top-color:var(--accent);border-radius:50%;animation:tourne .8s linear infinite}
@keyframes tourne{to{transform:rotate(360deg)}}
.graph{padding:14px 16px 8px}
.graph svg{width:100%;height:auto;display:block}
#cfg{max-width:480px;margin:10vh auto;padding:28px}
body.deconnecte #side,body.deconnecte #top{display:none}
#cfg label{display:block;font-size:12.5px;color:var(--mut);margin-top:10px}
#cfg input,#cfg select{width:100%;border:1px solid var(--trait);border-radius:8px;padding:9px 11px;margin:4px 0 0}
.formU{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 16px;padding:16px}
.formU label{font-size:12px;color:var(--mut);font-weight:500}
.formU input,.formU select{width:100%;border:1px solid var(--trait);border-radius:7px;padding:7px 9px;margin-top:3px}
.droits td{font-size:12.5px}
#cfg input{width:100%;border:1px solid var(--trait);border-radius:8px;padding:9px 11px;margin:12px 0}
/* ---------- Écrans étroits ---------- */
@media (max-width:900px){
  #side{position:fixed;left:-240px;z-index:80;transition:left .2s}
  body.menu #side{left:0;box-shadow:0 0 40px rgba(0,0,0,.4)}
  #top .burger{display:block}
  #main{padding:16px}
  .fiche{grid-template-columns:1fr}
  .form{grid-template-columns:1fr}
  .grille{grid-template-columns:1fr}
  .outils .rech input{width:170px}
}
</style>
</head>
<body>
<nav id="side"></nav>
<div id="wrap">
  <header id="top">
    <button class="burger" onclick="document.body.classList.toggle('menu')" aria-label="Menu"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
    <div id="gsearch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="gq" placeholder="Rechercher un devis, une commande, un client… (touche /)" autocomplete="off"><div id="gres"></div></div>
    <div class="droite"><span id="etat"></span><button class="btn" id="bRafr" title="Recharger les données depuis Baserow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button></div>
  </header>
  <main id="main"></main>
</div>
<div id="barreEnr"><span id="beTxt">Modifications non enregistrées</span><button class="btn" id="beAnn">Annuler</button><button class="btn p" id="beEnr">Enregistrer</button></div>
<div id="modal"><div class="box"><h3><span id="mTitre"></span><button onclick="fermerModal()">×</button></h3><div class="corps" id="mCorps"></div><div class="pied" id="mPied"></div></div></div>
<div id="toast"></div>
<script>
/* =====================================================================
   AKTEEV – interface KTE au-dessus de Baserow (base 592007)
   Même origine que l'éditeur (matthiaskte.github.io/editeur/) :
   le jeton est partagé via localStorage.kte_baserow_jeton.
   Règles : aucune suppression de ligne (on passe le statut à « Annulée ») ;
   devis / ARC / BL se créent et se mettent en page dans l'éditeur.
   ===================================================================== */
/* Passerelle d'accès (Scaleway, Paris) : vérifie la connexion Microsoft KTE et applique les droits du profil
   (tables, colonnes, fournisseurs Chine). Vide = ancien mode (jeton Baserow saisi dans le navigateur). */
const PASSERELLE='https://akteev5ytqabln-passerelle.functions.fnc.fr-par.scw.cloud';
const API=PASSERELLE?PASSERELLE.replace(/\/+$/,'')+'/api/database':'https://api.baserow.io/api/database';
const EDITEUR='./';
const CLE='kte_baserow_jeton';
let JETON=null;try{JETON=localStorage.getItem(CLE)}catch(e){}
const ls={get(k,d){try{const v=localStorage.getItem('akteev_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('akteev_'+k,JSON.stringify(v))}catch(e){}}};

let ENCOURS=0;const FILE=[];
async function api(path,opt={},essai=0){
  if(ENCOURS>=4)await new Promise(r=>FILE.push(r));ENCOURS++;let r;
  const {_re,...o}=opt;
  try{const auth=PASSERELLE?'Bearer '+await jetonAkteev(!!_re):'Token '+JETON;
    r=await fetch(API+path,{...o,headers:{Authorization:auth,'Content-Type':'application/json',...(o.headers||{})}})}finally{ENCOURS--;FILE.length&&FILE.shift()()}
  if(PASSERELLE&&r.status===401){if(!_re)return api(path,{...o,_re:true},essai);ecranConnexionMS('Votre session Microsoft a expiré : reconnectez-vous.');throw new Error('connexion requise')}
  if((r.status===429||r.status>=500)&&essai<4){await new Promise(x=>setTimeout(x,800*(essai+1)));return api(path,o,essai+1)}
  if(!r.ok){const t=await r.text();let m=t;try{const j=JSON.parse(t);m=j.error==='ACCES_REFUSE'?'Accès refusé : '+j.detail:(j.error||'')+' '+(j.detail?JSON.stringify(j.detail):'')}catch(e){}throw new Error(r.status+' '+m.slice(0,300))}
  return r.status===204?null:r.json();
}

/* Contrôle version : la formule Baserow tolère 120 s entre « Validé le » et la dernière modification. L'éditeur (même
   origine) note l'heure de chaque enregistrement dans localStorage.kte_modif_<type>_<id> ; on en tient compte ici. */
const DOC_T={1261170:'devis',1261374:'arc',1261382:'bl'};
function modifLocale(t,r){const k=DOC_T[t];if(!k||!r||!r['Validé le'])return false;let v=null;try{v=localStorage.getItem(`kte_modif_${k}_${r.id}`)}catch(e){}return !!v&&Date.parse(v)>Date.parse(r['Validé le'])}
function ajusterControle(t,rows){if(!DOC_T[t])return;for(const r of rows||[])if(modifLocale(t,r)&&!String(r['Contrôle version']||'').startsWith('⚠'))r['Contrôle version']='⚠ Modifié depuis la validation : nouvelle version à éditer'}
async function tout(t){let out=[],p=1;for(;;){const j=await api(`/rows/table/${t}/?user_field_names=true&size=200&page=${p}`);out=out.concat(j.results);if(!j.next)break;p++}return out}

function charger(t,force){
  if(force||!S.prom[t]){
    S.prom[t]=Promise.all([S.sch[t]&&!force?Promise.resolve(null):lireChamps(t),tout(t)]).then(([f,rows])=>{
      ajusterControle(t,rows);S.rows[t]=rows;if(f)S.sch[t]=faireSchema(f,false);else if(!S.sch[t]||S.sch[t].deduit)S.sch[t]=deduireSchema(rows);
      majCompteurs();return rows}).catch(e=>{delete S.prom[t];throw e});
  }
  return S.prom[t];
}
function faireSchema(fields,deduit){
  fields.sort((a,b)=>(b.primary?1:0)-(a.primary?1:0)||(a.order??0)-(b.order??0)||a.id-b.id);
  const par={};fields.forEach(f=>par[f.name]=f);
  return{fields,par,prim:(fields.find(f=>f.primary)||fields[0]||{}).name,deduit};
}
function deduireSchema(rows){
  const noms=[];const vus={};
  rows.forEach(r=>Object.keys(r).forEach(k=>{if(k!=='id'&&k!=='order'&&!vus[k]){vus[k]=1;noms.push(k)}}));
  const fields=noms.map((n,i)=>{
    const vals=rows.map(r=>r[n]).filter(v=>v!=null&&v!==''&&!(Array.isArray(v)&&!v.length));
    const f={id:-(i+1),name:n,order:i,primary:i===0,type:'text'};
    const v=vals[0];
    if(v===undefined){f.type='text'}
    else if(typeof v==='boolean')f.type='boolean';
    else if(Array.isArray(v)){
      if(v[0]&&('url' in v[0])&&('visible_name' in v[0]))f.type='file';
      else if(v[0]&&'color' in v[0]){f.type='multiple_select';f.select_options=optsVues(vals.flat())}
      else if(LIENS_SECOURS[n]&&v[0]&&'id' in v[0]){f.type='link_row';f.link_row_table_id=LIENS_SECOURS[n]}
      else f.type='lookup';
    }
    else if(typeof v==='object'&&'color' in v){f.type='single_select';f.select_options=optsVues(vals)}
    else if(typeof v==='object')f.type='formula';
    else if(vals.every(x=>/^\d{4}-\d{2}-\d{2}$/.test(x)))f.type='date';
    else if(vals.every(x=>/^\d{4}-\d{2}-\d{2}T/.test(x))){f.type='date';f.date_include_time=true}
    else if(vals.every(x=>/^-?\d+(\.\d+)?$/.test(String(x)))){f.type='number';f.number_decimal_places=Math.max(0,...vals.map(x=>(String(x).split('.')[1]||'').length))}
    else if(vals.some(x=>String(x).includes('\n')))f.type='long_text';
    else if(vals.every(x=>/^https?:\/\//.test(x)))f.type='url';
    return f});
  return faireSchema(fields,true);
}

function rendu(f,v,court){

  if(ty==='boolean')return v?'<span style="color:var(--ok)">✔</span>':'<span class="mut">—</span>';
  if(ty==='link_row'){const m=MOD_DE_TABLE[f.link_row_table_id];return v.map(x=>m?`<a class="chip" href="#/${m}/${x.id}" onclick="event.stopPropagation()">${esc(x.value)}</a>`:`<span class="chip">${esc(x.value)}</span>`).join('')}
  if(ty==='file')return v.map(x=>x.is_image?`<a href="${esc(x.url)}" target="_blank" onclick="event.stopPropagation()"><img src="${esc(x.thumbnails?.tiny?.url||x.url)}" style="height:${court?24:60}px;border-radius:4px;margin-right:4px;vertical-align:middle"></a>`:`<a href="${esc(x.url)}" target="_blank">${esc(x.visible_name)}</a>`).join(' ');
  if(ty==='date'||ty==='created_on'||ty==='last_modified')return f.date_include_time||ty!=='date'?esc(dtfr(v)):esc(dfr(v));
  if(ty==='number'||ty==='count'||ty==='rating'||((ty==='formula'||ty==='rollup')&&typeof v!=='object'&&/^-?\d+(\.\d+)?$/.test(String(v)))){return estMonnaie(n)?eur(v):nb(v)}
  if(ty==='url'||(typeof v==='string'&&/^https?:\/\/\S+$/.test(v)))return`<a href="${esc(v)}" target="_blank" onclick="event.stopPropagation()">${court?'Ouvrir ↗':esc(v.length>60?v.slice(0,57)+'…':v)}</a>`;
  if(ty==='email')return`<a href="mailto:${esc(v)}" onclick="event.stopPropagation()">${esc(v)}</a>`;
  if(Array.isArray(v))return v.map(x=>typeof x==='object'&&x&&'color' in x?badge(x):`<span class="chip">${esc(txt(x))}</span>`).join('');
  if(typeof v==='object'&&'color' in v)return badge(v);
  const s=txt(v);
  if(court&&s.length>90)return esc(s.slice(0,88))+'…';
  if(/^\d{4}-\d{2}-\d{2}/.test(s))return esc(s.length>10?dtfr(s):dfr(s));
  return esc(s);
}
function triVal(f,v){
  if(v==null||v==='')return null;const ty=f?.type;
  if(ty==='number'||ty==='count'||(typeof v==='string'&&/^-?\d+(\.\d+)?$/.test(v)))return+v;
  if(typeof v==='object'&&!Array.isArray(v)&&'color' in v){const o=(f?.select_options||[]).findIndex(x=>x.id===v.id);return o>=0?o:norm(v.value)}
  return norm(txt(v));
}

/* ---------- DDP en cours (demandes de prix en consultation chez les sous-traitants) ----------
   Une DDP = un devis au statut Brouillon ou Consultation SST. Ses consultations viennent de la table
   « Consultations SST » (une ligne par sous-traitant consulté). Réponses = offres reçues + refus. */
const DDP_STATUTS=['Brouillon','Consultation SST'];
const DDP_ETATS=[['complet','Toutes les réponses'],['partiel','Réponses partielles'],['aucune','Aucune réponse'],['sans','Pas encore consulté']];
function delaiRelance(iso){const j=new Date(iso).getDay();return(j>=4&&j<=6?96:48)*36e5} // jeudi, vendredi, samedi : 96 h
function ddpConsult(c){
  const rep=txt(c['Réponse'])||'En attente',base=c['Dernière relance']||c['Envoyée le'];
  const relance=rep==='En attente'&&base&&Date.now()-new Date(base)>delaiRelance(base);
  return{c,rep,relance,four:txt(c.Fournisseur)||txt(c['Réf']).replace(/^\S+\s*[–-]\s*/,'')||'?'}}
function ddpListe(D,CS){
  const par=new Map();(CS||[]).forEach(c=>{if(txt(c['Réponse'])==='Annulée')return;ids(c.Devis).forEach(i=>{if(!par.has(i))par.set(i,[]);par.get(i).push(c)})});
  return(D||[]).filter(d=>DDP_STATUTS.includes(txt(d.Statut))).map(d=>{
    const C=(par.get(d.id)||[]).map(ddpConsult).sort((a,b)=>String(a.c['Envoyée le']||'').localeCompare(String(b.c['Envoyée le']||''))||a.four.localeCompare(b.four,'fr'));
    const tot=C.length,off=C.filter(x=>x.rep==='Offre reçue'),ref=C.filter(x=>x.rep==='Refus').length,rep=off.length+ref;
    const etat=!tot?'sans':rep===tot?'complet':rep?'partiel':'aucune';
    const prix=off.filter(x=>x.c.Montant!=null&&x.c.Montant!==''&&(!x.c.Devise||/^(eur|€)$/i.test(x.c.Devise))).sort((a,b)=>+a.c.Montant-+b.c.Montant)[0];
    return{d,C,tot,rep,ref,etat,prix,relances:C.filter(x=>x.relance).length}});
}
function badgeReponses(x){
  if(!x.tot)return'<span class="badge" style="background:#F3F4F6;color:#6B7280">—</span>';
  const [bg,fg]={complet:['#DCFCE7','#15803D'],partiel:['#FFEDD5','#C2410C'],aucune:['#FEE2E2','#B91C1C']}[x.etat];
  return`<span class="badge" style="background:${bg};color:${fg};font-size:13.5px;font-weight:700;padding:3px 11px" title="${x.rep} réponse(s) sur ${x.tot} sous-traitant(s) consulté(s)">${x.rep}/${x.tot}</span>${x.ref?`<div class="mut" style="font-size:11.5px;margin-top:2px">dont ${x.ref} refus</div>`:''}`}
function puceSST(x){

/* Date de réception en rouge si le devis n'est pas répondu sous 48 h ouvrées (samedi et dimanche exclus) :
   le compte part du jour de réception (ou du lundi si reçue le week-end) ; rouge à partir du 2e jour ouvré suivant. */
function plusJoursOuvres(iso,n){const d=new Date(iso.slice(0,10)+'T12:00');while(d.getDay()===0||d.getDay()===6)d.setDate(d.getDate()+1);
  for(let i=0;i<n;){d.setDate(d.getDate()+1);if(d.getDay()!==0&&d.getDay()!==6)i++}return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}

   Table « Non-conformités » 1284881 : une ligne par NC, reliée à une affaire (Commandes). Origine Client / Interne,
   Secteur (Fraisage, Tournage, Fraisage fil, Montage, Contrôle, Sous-traitance, Traitement de surface, Fournisseur…),

   Plan d'action, Coût direct, Statut Ouverte → En cours → Soldée (« Soldée le » rempli automatiquement).
   N° NC-AA-NNN attribué à la création (compteur par année). Les NC « Annulée » sont exclues de la synthèse. */

  return`NC-${aa}-${String(max+1).padStart(3,'0')}`}

    if(NCS.per==='an')return d.startsWith(an);if(NCS.per==='12m')return d.slice(0,7)>=d12;if(/^\d{4}$/.test(NCS.per))return d.startsWith(NCS.per);return true})

/* ---------- Comparatif des sous-traitants d'un devis (bouton « Comparer les SST » de la fiche devis) ----------
   Lignes = lignes du devis (Lignes de devis) ; une colonne par sous-traitant consulté ayant fait une offre.
   Prix par ligne : table « Prix SST » (une ligne par ligne de devis × consultation), remplie par la tâche planifiée
   « Suivi des offres sous-traitants (DDP) ». Rapprochement par lien « Ligne de devis », sinon par repère (Rep).
   « Retenir » : coût unitaire (interne) de la ligne de devis = PU du sous-traitant, et case « Retenu » cochée. */
const T_PSST=1278828;
const estEUR=d=>!d||/^(eur|€)$/i.test(String(d).trim());
let CMPC=Object.assign({coef:1.3,pas:1,sens:'sup'},ls.get('cmpc',{}));
const vide=v=>v==null||v==='';
function arrondiPV(c){const x=+c*(+CMPC.coef||0),p=+CMPC.pas||1;return CMPC.sens==='inf'?Math.floor(x/p+1e-9)*p:Math.ceil(x/p-1e-9)*p}
const margeTxt=(pv,c)=>!vide(pv)&&+pv>0&&!vide(c)?Math.round((pv-c)/pv*100)+' %':'';
async function comparerSST(dv){

function comparatifDonnees(dv){
  const L=(S.rows[T_LDV]||[]).filter(l=>ids(l.Devis).includes(dv.id)).sort((a,b)=>(+a.Ordre||0)-(+b.Ordre||0)||a.id-b.id);
  const C=(S.rows[MODS.consult.t]||[]).filter(c=>ids(c.Devis).includes(dv.id)&&txt(c['Réponse'])!=='Annulée').map(ddpConsult);
  const cids=new Set(C.map(x=>x.c.id));
  const P=(S.rows[T_PSST]||[]).filter(p=>ids(p.Consultation).some(i=>cids.has(i)));
  const prixDe=c=>P.filter(p=>ids(p.Consultation).includes(c.c.id));
  const cols=C.filter(x=>x.rep==='Offre reçue'||prixDe(x).length).sort((a,b)=>a.four.localeCompare(b.four,'fr'));
  const autres=C.filter(x=>!cols.includes(x));
  const lie=(p,l)=>ids(p['Ligne de devis']).includes(l.id)||(!ids(p['Ligne de devis']).length&&p.Rep!=null&&p.Rep!==''&&l.Rep!=null&&+p.Rep===+l.Rep);
  const pris=new Set();
  const lignes=L.map(l=>{const par={};for(const x of cols){const p=prixDe(x).find(p=>lie(p,l));if(p){par[x.c.id]=p;pris.add(p.id)}}return{l,par}});
  /* Prix sans ligne de devis correspondante (repère inconnu) : lignes « hors devis » regroupées par repère / désignation */
  const hors={};for(const x of cols)for(const p of prixDe(x)){if(pris.has(p.id))continue;const k=p.Rep!=null&&p.Rep!==''?'r'+p.Rep:'d'+norm(txt(p['Désignation SST']));(hors[k]||(hors[k]={l:null,rep:p.Rep,des:txt(p['Désignation SST']),par:{}})).par[x.c.id]=p}
  return{L,C,cols,autres,lignes:lignes.concat(Object.values(hors))};
}

        ${eu&&min&&pu>min?`<div class="cmpEc">+${Math.round((pu-min)/min*100)} %</div>`:''}${p.Retenu?'<div class="cmpEc" style="color:#15803D;font-weight:700">✓ retenu</div>':ecr&&x.l&&eu?`<button class="btn mini" data-ret="${p.id}" data-l="${x.l.id}">Retenir</button>`:''}</td>`}
    const prop=!vide(cout)&&+CMPC.coef>0?arrondiPV(cout):'';

  const nL=lignes.filter(x=>x.l).length,tv=cols.filter(c=>nbL[c.c.id]===nL).map(c=>tot[c.c.id]),tmin=tv.length>1?Math.min(...tv):null;

    return`<b>${v?eur(v):'—'}</b><div class="cmpEc">${ok}/${LL.length} lignes</div>${v&&c?`<div class="cmpEc">marge ${Math.round((v-c)/v*100)} % (${eur(v-c)})</div>`:''}`})()}</td></tr></tfoot></table></div>
  <div class="mut" style="font-size:12px;margin-top:8px">Vert : moins cher de la ligne · rouge : plus cher · encadré vert : retenu · <span style="color:#C2410C">●</span> prix à vérifier. « Retenir » écrit le PU dans le coût unitaire (interne) de la ligne de devis ; la colonne orange est le prix de vente du devis. Prix par ligne remplis automatiquement à la réception des offres (tâche « Suivi des offres SST »).</div>`;

  $('mCorps').querySelectorAll('input[data-pv]').forEach(i=>{i.onkeydown=e=>{if(e.key==='Enter')i.blur()};i.onchange=()=>{const v=i.value.trim()===''?null:Math.round(+i.value.replace(',','.')*100)/100;
    if(v!=null&&!(v>=0))return toast('Prix invalide',true);enregistrerPV(dv,[{id:+i.dataset.pv,'Prix unitaire HT':v}])}});
  const prefs=()=>{CMPC={coef:+String($('cCoef').value).replace(',','.')||0,pas:+$('cPas').value,sens:$('cSens').value};ls.set('cmpc',CMPC);
    $('mCorps').querySelectorAll('input[data-pv]').forEach(i=>{const l=(S.rows[T_LDV]||[]).find(r=>r.id==i.dataset.pv),c=l&&l['Coût unitaire (interne)'];i.placeholder=!vide(c)&&CMPC.coef>0?arrondiPV(c):''})};

    $('cApp').onclick=()=>{prefs();if(!(CMPC.coef>0))return toast('Coefficient invalide',true);

  $('mCorps').querySelectorAll('button[data-tout]').forEach(b=>b.onclick=()=>{const cid=+b.dataset.tout;

    if(!paires.length)return toast('Aucun prix en euros à retenir',true);retenirSST(dv,paires)});

async function enregistrerPV(dv,items){
  $('mCorps').querySelectorAll('input,button.mini').forEach(b=>b.disabled=true);

    toast(items.length>1?items.length+' prix de vente enregistrés':'Prix de vente enregistré')}
  catch(e){toast('Échec : '+e.message,true)}

async function retenirSST(dv,paires){
  const {lignes}=comparatifDonnees(dv);
  $('mCorps').querySelectorAll('button.mini').forEach(b=>b.disabled=true);
  try{
    for(const [lid,pid] of paires){
      const x=lignes.find(y=>y.l&&y.l.id===lid);if(!x)continue;
      const p=Object.values(x.par).find(p=>p.id===pid);if(!p)continue;
      const r=await api(`/rows/table/${T_LDV}/${lid}/?user_field_names=true`,{method:'PATCH',body:JSON.stringify({'Coût unitaire (interne)':+p['PU HT']})});majRow(T_LDV,r);
      for(const o of Object.values(x.par)){const v=o.id===pid;if(!!o.Retenu===v)continue;
        const r2=await api(`/rows/table/${T_PSST}/${o.id}/?user_field_names=true`,{method:'PATCH',body:JSON.stringify({Retenu:v})});majRow(T_PSST,r2)}
    }
    toast(paires.length>1?paires.length+' lignes retenues':'Prix retenu');
  }catch(e){toast('Échec : '+e.message,true)}
  dessinerComparatif(dv);
}

/* ---------- Statistiques (données comptables Axonaut) ----------
   Table Baserow « Stats Axonaut » (T_STATS) : une ligne par mois (« 2026-01 »…, plus « Avant 2026 » pour les
   commandes fournisseurs antérieures d'affaires facturées dans l'année). Remplie par la tâche planifiée
   « Stats Axonaut → Akteev » (API Axonaut, le navigateur ne peut pas l'appeler directement : CORS).
   Colonnes JSON : Factures [n°, date, id client, client, affaire, nom commande, HT, TTC, reste dû, échéance, payée le, commercial, id]
   Commandes [affaire, nom, date, id client, client, HT, livraison prévue, nb factures, id]
   Achats (commandes fournisseurs) [affaire, titre, date, fournisseur, HT, id]
   Dépenses (factures fournisseurs) [date, fournisseur, réf, HT, catégorie, payée, id]
   Marge sur achats d'une affaire = CA facturé − commandes fournisseurs de l'affaire ; pour une période, les achats
   sont imputés au prorata du facturé (taux d'achat = achats / max(commandé, facturé total)). */
const T_STATS=1277595;
const STATS_ACTIF=false; // onglet en attente : à réactiver quand les identifiants / mots de passe seront en place
const STATS_COUL={ca:'#2F6FED',cde:'#9DBBF7',marge:'#16A34A',achats:'#F59E0B',dep:'#DC2626'};
const MOIS_COURT=m=>new Date(m+'-01T00:00').toLocaleDateString('fr-FR',{month:'short'}).replace('.','');
const MOIS_LONG=m=>new Date(m+'-01T00:00').toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
const pct=x=>isFinite(x)?(Math.round(x*1000)/10).toLocaleString('fr-FR')+' %':'—';
let STV=ls.get('stv',{o:'mois',du:'',au:'',q:'',mat:false});
const STRI={};
function statsDonnees(){
  const R=S.rows[T_STATS]||[],P=v=>{try{const x=JSON.parse(v||'[]');return Array.isArray(x)?x:[]}catch(e){return[]}};
  const F=[],C=[],A=[],D=[];let maj='';const mois=[];
  for(const r of R){const m=txt(r.Mois);if(/^\d{4}-\d{2}$/.test(m))mois.push(m);
    P(r.Factures).forEach(x=>F.push({num:x[0],date:x[1],cid:x[2],cli:x[3],aff:x[4],cnom:x[5],ht:+x[6]||0,ttc:+x[7]||0,reste:+x[8]||0,ech:x[9],paye:x[10],com:x[11],id:x[12]}));
    P(r.Commandes).forEach(x=>C.push({aff:x[0],nom:x[1],date:x[2],cid:x[3],cli:x[4],ht:+x[5]||0,livr:x[6],nbf:x[7],id:x[8]}));
    P(r.Achats).forEach(x=>A.push({aff:x[0],titre:x[1],date:x[2],four:x[3],ht:+x[4]||0,id:x[5]}));
    P(r['Dépenses']).forEach(x=>D.push({date:x[0],four:x[1],ref:x[2],ht:+x[3]||0,cat:x[4]||'Autres',payee:!!x[5],id:x[6]}));
    const u=r['Mis à jour le'];if(u&&u>maj)maj=u}
  mois.sort();
  // affaires
  const AF={};const af=k=>AF[k]||(AF[k]={aff:k,cid:null,cli:'',noms:new Set(),ca:0,cde:0,dateCde:'',achats:0,fours:new Map(),nbf:0,derF:''});
  for(const f of F){const a=af(f.aff||'(sans commande)');a.ca+=f.ht;a.nbf++;if(!a.cid){a.cid=f.cid;a.cli=f.cli}if(f.cnom)a.noms.add(f.cnom);if(f.date>a.derF)a.derF=f.date}
  for(const c of C){const a=af(c.aff);a.cde+=c.ht;if(!a.cid){a.cid=c.cid;a.cli=c.cli}if(!a.dateCde||c.date<a.dateCde)a.dateCde=c.date;if(c.nom)a.noms.add(c.nom)}
  for(const x of A){const a=af(x.aff);a.achats+=x.ht;a.fours.set(x.four,(a.fours.get(x.four)||0)+x.ht)}
  for(const a of Object.values(AF)){const base=Math.max(a.cde,a.ca);a.taux=base>0?a.achats/base:0;a.marge=a.ca-a.ca*a.taux;
    a.resteAF=a.cde>0?Math.max(0,a.cde-a.ca):0}
  return{F,C,A,D,mois,maj,AF};
}
function statsPeriode(X){const ms=X.mois;let du=STV.du&&ms.includes(STV.du)?STV.du:ms[0]||'',au=STV.au&&ms.includes(STV.au)?STV.au:ms[ms.length-1]||'';if(du>au)[du,au]=[au,du];
  const dans=d=>{const m=String(d||'').slice(0,7);return m>=du&&m<=au};return{du,au,dans}}
function statsClients(){const M={};for(const r of S.rows[MODS.clients.t]||[]){const id=+r['ID Axonaut'];if(id)M[id]=r}return M}
function statsTable(id,cols,rows,opt={}){
  const st=STRI[id]||(STRI[id]={k:opt.tri||cols[0].k,d:opt.desc===false?1:-1});
  const L=[...rows].sort((a,b)=>{const x=a[st.k],y=b[st.k];return(typeof x==='number'||typeof y==='number'?((+x||0)-(+y||0)):String(x??'').localeCompare(String(y??''),'fr'))*st.d});
  const lim=opt.lim&&!opt.tout?opt.lim:Infinity;
  let h=`<div class="tw"><table class="l" id="${id}"><thead><tr>${cols.map(c=>`<th class="${c.n?'n':''}" data-k="${c.k}" title="${esc(c.t||'')}">${esc(c.l)}${st.k===c.k?(st.d>0?' ▲':' ▼'):''}</th>`).join('')}</tr></thead><tbody>`;
  h+=L.slice(0,lim).map(r=>`<tr ${opt.lien?`data-h="${esc(opt.lien(r)||'')}"`:''} ${r._cl?`class="${r._cl}"`:''}>${cols.map(c=>`<td class="${c.n?'n':''}${c.p?' prim':''}" ${c.s?`style="${c.s(r)}"`:''}>${c.f?c.f(r[c.k],r):esc(r[c.k]??'')}</td>`).join('')}</tr>`).join('');
  h+='</tbody>';
  if(opt.total)h+=`<tfoot><tr>${cols.map((c,i)=>`<td class="${c.n?'n':''}">${i===0?'Total':c.tot?c.tot(L):''}</td>`).join('')}</tr></tfoot>`;
  h+='</table></div>';
  if(L.length>lim)h+=`<div class="plus"><button class="btn" data-tout="${id}">Afficher les ${L.length} lignes</button></div>`;
  if(!L.length)h+='<div class="vide">Aucune donnée sur la période</div>';
  return h;
}

function exporterStats(){
  const t=document.querySelector('#main table.l');if(!t)return;

function grapheStats(ms,series,opt={}){
  // series : [{n:'CA', v:[...], c:couleur, type:'barre'|'ligne'}]
  const W=760,H=210,G=44,b=(W-G)/Math.max(ms.length,1),barres=series.filter(s=>s.type!=='ligne');
  const max=Math.max(1,...series.flatMap(s=>s.v)),min=Math.min(0,...series.flatMap(s=>s.v));
  const y=v=>H-(v-min)/(max-min)*H*.92;
  let s=`<svg viewBox="0 0 ${W} ${H+44}" role="img">`;
  for(let i=0;i<=4;i++){const v=min+(max-min)/0.92*i/4*0.92;const Y=y(v);s+=`<line x1="${G}" x2="${W}" y1="${Y}" y2="${Y}" stroke="#EEF0F4"/><text x="${G-6}" y="${Y+4}" text-anchor="end" font-size="10" fill="#8A93A6">${Math.abs(v)>=1000?Math.round(v/1000)+'k':Math.round(v)}</text>`}
  if(min<0)s+=`<line x1="${G}" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="#C9CFDA"/>`;
  ms.forEach((m,i)=>{const X0=G+i*b,bw=b*.72/Math.max(barres.length,1);
    barres.forEach((se,j)=>{const v=se.v[i]||0,y1=y(Math.max(v,0)),y2=y(Math.min(v,0));
      s+=`<rect x="${X0+b*.14+j*bw}" y="${y1}" width="${bw-1}" height="${Math.max(y2-y1,1)}" rx="3" fill="${se.c}"><title>${MOIS_LONG(m)} – ${se.n} : ${eur(v)}</title></rect>`});
    s+=`<text x="${X0+b/2}" y="${H+16}" text-anchor="middle" font-size="11" fill="#6B7385">${MOIS_COURT(m)}</text>`});
  series.filter(se=>se.type==='ligne').forEach(se=>{const pts=ms.map((m,i)=>`${G+i*b+b/2},${y(se.v[i]||0)}`);
    s+=`<polyline points="${pts.join(' ')}" fill="none" stroke="${se.c}" stroke-width="2.2"/>`+ms.map((m,i)=>`<circle cx="${G+i*b+b/2}" cy="${y(se.v[i]||0)}" r="3.5" fill="${se.c}"><title>${MOIS_LONG(m)} – ${se.n} : ${eur(se.v[i])}</title></circle>`).join('')});
  s+=`<g font-size="11.5" fill="#4A5366">${series.map((se,i)=>`<rect x="${G+i*150}" y="${H+28}" width="11" height="11" rx="2" fill="${se.c}"/><text x="${G+i*150+16}" y="${H+38}">${esc(se.n)}</text>`).join('')}</g>`;
  return s+'</svg>';
}

   (FA_<affaire>_<Métier>.pdf, RC_…, PC_…). Renvoie [{value:libellé court, url, fichier}]. */
function fichesNotes(notes){
  const vus=new Set(),out=[];
  for(const m of String(notes||'').matchAll(/https?:\/\/[^\s<>"]+/g)){const url=m[0].replace(/[).,;]+$/,'');if(vus.has(url))continue;vus.add(url);
    let f=url.split(/[?#]/)[0].split('/').pop();try{f=decodeURIComponent(f)}catch(e){}
    if(!/\.(pdf|xlsx?|docx?)$/i.test(f))continue;
    const b=f.replace(/\.[^.]+$/,'');let lab;
    if(/^FA_/i.test(b)){lab=b.replace(/^FA_[^_]+_?/i,'').replace(/_/g,' ')||'Fiche';if(/^achats/i.test(lab))lab='Achats'}
    else if(/^RC_/i.test(b))lab='RC';else if(/^PC_/i.test(b))lab='Plan contrôle';else lab=b.length>24?b.slice(0,22)+'…':b;
    out.push({value:lab,url,fichier:f})}
  return out}

function piecesTache(r,cde,SY,DV,LD){

  let q=ids(r['Synthèse commande']).map(i=>SY.get(i)).filter(x=>x&&!/annul/i.test(txt(x.Statut))).sort(ord).map(x=>+x['Qté attribuée']||+x['Quantité']||0);
  if(!q.length&&/exp[ée]di|livr/i.test(txt(r['Type de tâche'])+' '+txt(r['Libellé']))){
    const dv=cde.flatMap(c=>ids(c.Devis)).map(i=>DV.get(i)).filter(Boolean);
    q=dv.flatMap(d=>ids(d['Lignes de devis'])).map(i=>LD.get(i)).filter(Boolean).sort(ord).map(x=>+x['Quantité']||0)}
  if(!q.length){const mt=String(txt(r.Notes)).match(/^\s*(\d+(?:[.,]\d+)?)\s*(?:x|×)?\s*[A-Za-zÀ-ÿ]/);if(mt)q=[+mt[1].replace(',','.')]}

    Object.keys(G).sort((a,b)=>a.localeCompare(b,'fr')).map(k=>`<optgroup label="${esc(k)}">${G[k].sort((a,b)=>txt(b['N° affaire']).localeCompare(txt(a['N° affaire']))).map(c=>o(c.id,`${txt(c['N° affaire'])} – ${String(txt(c.Objet)).slice(0,70)}`)).join('')}</optgroup>`).join('');

function affLue(l,scL){ // affectation actuelle d'une ligne : 'stock' | 'prorata' | id commande | ''
  if(scL.par['Affaire']&&ids(l.Affaire).length)return ids(l.Affaire)[0];
  if(scL.par['Affectation']&&/stock/i.test(txt(l.Affectation)))return'stock';
  if(scL.par['Affectation']&&/maint/i.test(txt(l.Affectation)))return'maint';
  if(scL.par['Affectation']&&/r[ée]parti|prorata/i.test(txt(l.Affectation)))return'prorata';
  const t=String(l['Précisions']||'').split('\n').reverse().find(x=>AFF_TAG.test(x));if(!t)return'';
  const v=t.replace(AFF_TAG,'').trim();if(/^stock/i.test(v))return'stock';if(/^maint/i.test(v))return'maint';if(/prorata/i.test(v))return'prorata';
  const c=(S.rows[MODS.commandes.t]||[]).find(c=>txt(c['N° affaire'])===v.split(/\s/)[0]);return c?c.id:'';
}

async function enregistrerAffectation(){
  const {cf,L}=AFFX,tL=1263349,scL=sch(tL),scC=sch(MODS.cf.t),C=S.rows[MODS.commandes.t]||[];
  const choix={};L.forEach(l=>{const fr=AFF_FRAIS.test(l.Description||'');choix[l.id]=AFFX.mode==='complete'?(fr?'prorata':AFFX.tout):AFFX.val[l.id]});
  if(AFFX.mode==='complete'&&!AFFX.tout){toast('Choisissez l’affaire (ou le stock, ou la maintenance)',true);return}
  const manq=L.filter(l=>!choix[l.id]);if(manq.length){toast(`${manq.length} ligne(s) sans affectation : ${manq.map(l=>l.Ordre||'?').join(', ')}`,true);return}
  if(L.length&&L.every(l=>choix[l.id]==='prorata')){toast('Affectez au moins une ligne à une affaire, au stock ou à la maintenance',true);return}
  $('affOk').disabled=true;
  const nAff=v=>txt((C.find(c=>c.id==v)||{})['N° affaire']);
  const optL=n=>(scL.par['Affectation']?.select_options||[]).find(o=>norm(o.value).startsWith(n));
  for(const l of L){const v=choix[l.id],corps={};
    if(scL.par['Affaire']&&scL.par['Affectation']){
      corps.Affaire=/^\d+$/.test(v)?[+v]:[];const k=v==='stock'?'stock':v==='maint'?'maint':v==='prorata'?'repart':'affaire';const o=optL(k)||(v==='prorata'?null:optL(k));corps.Affectation=o?o.id:null;
    }else{
      const lib=v==='stock'?'Stock':v==='maint'?'Maintenance':v==='prorata'?'réparti au prorata du montant':nAff(v);
      corps['Précisions']=[...String(l['Précisions']||'').split('\n').filter(x=>x.trim()&&!AFF_TAG.test(x)),'Affectation : '+lib].join('\n');
    }
    const r=await api(`/rows/table/${tL}/${l.id}/?user_field_names=true`,{method:'PATCH',body:JSON.stringify(corps)});majRow(tL,r);
  }
  const affs=[...new Set(Object.values(choix).filter(v=>/^\d+$/.test(v)).map(Number))],stock=Object.values(choix).includes('stock'),maint=Object.values(choix).includes('maint');
  const opts=scC.par['Affectation']?.select_options||[],op=n=>opts.find(o=>norm(o.value).startsWith(n));
  const nSect=affs.length+(stock?1:0)+(maint?1:0);
  const type=nSect>1?'multi':affs.length?'affaire':maint?'maint':'stock';
  const o=type==='multi'?(op('multi')||op('affaire')):op(type);
  const lib=type==='stock'?'Stock':type==='maint'?'Maintenance':[...affs.map(nAff),...(stock?['stock']:[]),...(maint?['maintenance']:[])].join(', ').replace(/^(.*), (stock|maintenance)$/,'$1 + $2');
  const com=[String(cf['Commentaire interne']||'').split('\n').filter(x=>!/^Affectation (complète|ligne par ligne)/.test(x)).join('\n').trim(),
    `Affectation ${AFFX.mode==='complete'?'complète':'ligne par ligne'} saisie dans Akteev le ${dfr(auj())} : ${lib}.`].filter(Boolean).join('\n');
  const corps={Affaire:affs,'Commentaire interne':com};if(o)corps.Affectation=o.id;
  const r=await api(`/rows/table/${MODS.cf.t}/${cf.id}/?user_field_names=true`,{method:'PATCH',body:JSON.stringify(corps)});majRow(MODS.cf.t,r);
  delete S.prom[MODS.commandes.t];
  toast('Affectation enregistrée – '+lib);location.hash=`#/cf/${cf.id}`;
}

async function repondreClient(row,forcer){
  const num=txt(row['N° devis']);
  if(!row.PDF){toast(`Pas de PDF pour ${num} : ouvrez le devis dans l’éditeur et cliquez sur « 📄 PDF » (ou validez-le).`,true);return}
  if(String(txt(row['Contrôle version'])).startsWith('⚠')||modifLocale(MODS.devis.t,row)){toast(`${num} a été modifié depuis sa validation : validez la nouvelle version dans l’éditeur avant de l’envoyer.`,true);return}
  const b=$('bRep');if(b){b.disabled=true;b.textContent='Préparation du mail…'}
  try{
    const j=await jetonGraph(['Mail.ReadWrite','Files.ReadWrite.All']);
    const mem=brouillonsRep()[row.id];
    if(mem&&!forcer){const ex=await brouillonValide(j,mem);
      if(!ex)memoBrouillon(row.id,null);
      else{if(b){b.disabled=false;b.innerHTML=`${ico('mail')}Répondre au client`}
        const c=await choixBrouillon(num,mem);
        if(c==='ouvrir'){window.open(ex.webLink,'_blank')||toast('Autorisez les fenêtres surgissantes pour ouvrir le brouillon.',true);return}
        if(c!=='nouveau')return;
        if(b){b.disabled=true;b.textContent='Préparation du mail…'}}}
    await Promise.all([charger(MODS.clients.t).catch(()=>[]),charger(MODS.referents.t).catch(()=>[])]);
    const cli=(S.rows[MODS.clients.t]||[]).find(r=>r.id===row.Client?.[0]?.id);
    const ref=(S.rows[MODS.referents.t]||[]).find(r=>r.id===row['Référent KTE']?.[0]?.id);
    const mailCli=txt(cli?.['E-mail']).split(/[;, ]+/).filter(x=>/@/.test(x));
    // 1. PDF du devis depuis SharePoint
    const it=await graph(j,'/shares/u!'+b64url(txt(row.PDF))+'/driveItem');
    const dl=it['@microsoft.graph.downloadUrl'];if(!dl)throw new Error('PDF introuvable dans SharePoint');
    const pdf=await (await fetch(dl)).blob();
    // 2. Brouillon : réponse au mail d'origine, sinon nouveau mail au client
    let brouillon=null,mode='nouveau',partage=null;
    const ews=idMailSource(row['Mail source']),src=srcMail(row['Mail source']);
    const repondreA=async orig=>{brouillon=await graph(j,`/me/messages/${encodeURIComponent(orig.id)}/createReply`,{method:'POST',body:'{}'});mode='réponse'};
    if(src){try{const orig=await mailParId(j,'/me',src.id);if(orig)await repondreA(orig)}catch(e){console.warn('Mail source',e)}
      // mail reçu seulement dans une autre boîte (ex. kte@) : on le lit là-bas pour répondre depuis sa propre boîte
      if(!brouillon&&src.box&&src.box.toLowerCase()!==String(MSAL?.getActiveAccount()?.username||'').toLowerCase()){
        try{const j2=await jetonGraph(['Mail.Read.Shared']);const base=`/users/${encodeURIComponent(src.box)}`;const o=await mailParId(j2,base,src.id);
          if(o)partage=await graph(j2,`${base}/messages/${encodeURIComponent(o.id)}?$select=subject,from,toRecipients,ccRecipients,body,receivedDateTime`)}
        catch(e){console.warn('Mail source (boîte '+src.box+')',e)}}}
    else if(ews){try{const orig=await retrouverMail(j,ews);if(orig)await repondreA(orig)}
      catch(e){console.warn('Mail source',e)}}
    if(brouillon){
      const internes=(brouillon.toRecipients||[]).every(r=>/@kte-fr\.com$/i.test(r.emailAddress?.address||''));
      const d=await graph(j,`/me/messages/${brouillon.id}?$select=body,subject`);
      const html=d.body.contentType==='html'?d.body.content:`<pre>${esc(d.body.content)}</pre>`;
      const corps=/<body[^>]*>/i.test(html)?html.replace(/<body[^>]*>/i,m=>m+texteReponse(row,cli,ref)):texteReponse(row,cli,ref)+html;
      const maj={body:{contentType:'HTML',content:corps}};
      if(!(d.subject||'').includes(num))maj.subject=`${d.subject||'RE:'} – ${num}`;
      if(internes&&mailCli.length)maj.toRecipients=mailCli.map(a=>({emailAddress:{address:a}}));
      await graph(j,`/me/messages/${brouillon.id}`,{method:'PATCH',body:JSON.stringify(maj)});
    }else if(partage){
      // réponse rédigée dans sa propre boîte au mail reçu sur la boîte partagée : même objet (RE: … – n°), même expéditeur, mail d'origine cité
      const de=partage.from?.emailAddress||{},adr=a=>(a||[]).map(r=>esc(r.emailAddress?.name||r.emailAddress?.address||'')).join('; ');
      const obj=(partage.subject||'').replace(/^\s*(re|tr|fw|fwd)\s*:\s*/i,'');
      const cite=`<hr style="border:none;border-top:1px solid #E1E1E1"><div style="font-family:Calibri,Arial,sans-serif;font-size:11pt"><b>De :</b> ${esc(de.name||'')} &lt;${esc(de.address||'')}&gt;<br><b>Envoyé :</b> ${esc(new Date(partage.receivedDateTime).toLocaleString('fr-FR'))}<br><b>À :</b> ${adr(partage.toRecipients)}${partage.ccRecipients?.length?`<br><b>Cc :</b> ${adr(partage.ccRecipients)}`:''}<br><b>Objet :</b> ${esc(partage.subject||'')}</div><br>`;
      const orig=partage.body?.contentType==='html'?(partage.body.content.match(/<body[^>]*>([\s\S]*)<\/body>/i)?.[1]??partage.body.content):`<pre>${esc(partage.body?.content||'')}</pre>`;
      const a=de.address&&!/@kte-fr\.com$/i.test(de.address)?[de.address]:mailCli;
      brouillon=await graph(j,'/me/messages',{method:'POST',body:JSON.stringify({subject:`RE: ${obj}${obj.includes(num)?'':' – '+num}`,
        body:{contentType:'HTML',content:texteReponse(row,cli,ref)+cite+orig},toRecipients:a.map(x=>({emailAddress:{address:x}}))})});
      mode='réponse';
    }else{
      brouillon=await graph(j,'/me/messages',{method:'POST',body:JSON.stringify({subject:`Offre KTE ${num}${txt(row.Objet)?' – '+txt(row.Objet):''}`,
        body:{contentType:'HTML',content:texteReponse(row,cli,ref)},toRecipients:mailCli.map(a=>({emailAddress:{address:a}}))})});
    }
    // 3. Pièce jointe
    await graph(j,`/me/messages/${brouillon.id}/attachments`,{method:'POST',body:JSON.stringify({'@odata.type':'#microsoft.graph.fileAttachment',name:it.name||`Devis_${num}.pdf`,contentType:'application/pdf',contentBytes:await versB64(pdf)})});
    const w=await graph(j,`/me/messages/${brouillon.id}?$select=webLink,toRecipients`);
    const dest=(w.toRecipients||[]).map(r=>r.emailAddress?.address).filter(Boolean).join(', ')||'(destinataire à compléter)';
    memoBrouillon(row.id,{id:brouillon.id,t:new Date().toISOString()});
    const ouvert=window.open(w.webLink,'_blank');
    if(b){b.disabled=false;b.innerHTML=`${ico('mail')}Répondre au client`}
    toast(`Brouillon ${mode==='réponse'?'de réponse ':''}prêt dans Outlook (Brouillons) pour ${dest}, avec ${it.name}.${ouvert?'':' Recliquez sur « Répondre au client » pour l’ouvrir.'} Après l’envoi, passez le devis à « Envoyé ».`);
  }catch(e){console.error(e);toast('Réponse au client : '+e.message,true);if(b){b.disabled=false;b.innerHTML=`${ico('mail')}Répondre au client`}}
}
async function pdfTaches(cde,TT){
  if(!JSPDF){await chargerScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');await chargerScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js');JSPDF=window.jspdf.jsPDF}
  const p=s=>String(s??'').replace(/[–—]/g,'-').replace(/[‘’]/g,"'").replace(/[“”«»]/g,'"').replace(/…/g,'...').replace(/ | /g,' ').replace(/[^\x00-\xff€]/g,'');
  const n=txt(cde['N° affaire']),doc=new JSPDF({orientation:'landscape',unit:'mm',format:'a4'});
  const ech=r=>r['Échéance']||'9999';
  const L=[...TT].sort((a,b)=>ech(a).localeCompare(ech(b))||a.id-b.id);
  const C=S.rows[MODS.commandes.t]||[],SY=new Map((S.rows[MODS.synthese.t]||[]).map(x=>[x.id,x])),DV=new Map((S.rows[MODS.devis.t]||[]).map(x=>[x.id,x])),LD=new Map((S.rows[1261171]||[]).map(x=>[x.id,x]));
  doc.setFont('helvetica','bold');doc.setFontSize(15);doc.text(p(`KTE - Tâches de l'affaire ${n}`),14,15);
  doc.setFont('helvetica','normal');doc.setFontSize(10);
  doc.text(p([txt(cde.Client),txt(cde.Objet)].filter(Boolean).join(' - ')),14,21);
  doc.text(p([cde['N° Cde Client']?'Cde client '+txt(cde['N° Cde Client']):'',cde['Date Livraison']?'Livraison prévue '+dfr(cde['Date Livraison']):'',txt(cde['Référent KTE'])?'Référent '+txt(cde['Référent KTE']):''].filter(Boolean).join('   |   ')),14,26);
  doc.autoTable({startY:31,head:[['Tâche','Référent','Échéance','Statut','Fait le','Pièces','Notes'].map(p)],
    body:L.map(r=>[txt(r['Type de tâche'])||String(txt(r['Libellé'])).replace(/^\S+\s*[–-]\s*/,''),txt(r['Référent']),dfr(r['Échéance']),txt(r.Statut),dfr(r['Fait le']),
      (()=>{try{return piecesTache(r,(r.Commande||[]).map(x=>C.find(c=>c.id===x.id)).filter(Boolean),SY,DV,LD)}catch(e){return''}})(),txt(r.Notes)].map(p)),
    styles:{fontSize:8.5,cellPadding:1.8,valign:'top'},headStyles:{fillColor:[31,58,95]},
    columnStyles:{0:{cellWidth:48},1:{cellWidth:24},2:{cellWidth:20},3:{cellWidth:28},4:{cellWidth:20},5:{cellWidth:26},6:{cellWidth:'auto'}},margin:{left:14,right:14}});
  const nbP=doc.getNumberOfPages();for(let i=1;i<=nbP;i++){doc.setPage(i);doc.setFontSize(8);doc.setTextColor(120);doc.text(p(`${n} - édité le ${new Date().toLocaleDateString('fr-FR')} - page ${i}/${nbP}`),283,203,{align:'right'})}
  return doc.output('blob')}

/* ---------- Bons de livraison : création en un clic depuis une commande ----------
   Même logique que l'éditeur : n° BL-<affaire>-NN, lignes reprises de l'ARC (sinon du devis), « Déjà livré » =
   somme des BL précédents de l'affaire ; « Livré » = reste par défaut (BL complet) ou quantités saisies (partiel).
   Le BL est créé en Brouillon ; la mise en page / validation / PDF se fait dans l'éditeur (?bl=…). */
const T_LBL=1261381,T_LARC=1261373,T_LDV=1261171;
async function nouveauBL(){
  ouvrirModal('Nouveau BL : choisir la commande','<div class="charge">Chargement…</div>','');
  const C=await charger(MODS.commandes.t);const sc=sch(MODS.commandes.t);
  const dessiner=q=>{const w=norm(q).split(/\s+/).filter(Boolean);
    const L=C.filter(r=>/command/i.test(txt(r.Statut))||w.length).filter(r=>{const s=norm(Object.values(r).map(txt).join(' '));return w.every(x=>s.includes(x))}).sort((a,b)=>String(txt(b['N° affaire'])).localeCompare(String(txt(a['N° affaire'])))).slice(0,100);
    $('mListe').innerHTML=L.map(r=>`<div class="choixL" data-id="${r.id}"><span><b>${esc(txt(r['N° affaire']))}</b> ${esc(txt(r.Client))} <small>${esc(txt(r.Objet)).slice(0,70)}</small></span></div>`).join('')||'<div class="vide">Aucune commande</div>';
    $('mListe').querySelectorAll('[data-id]').forEach(d=>d.onclick=()=>fenetreBL(C.find(r=>r.id==d.dataset.id)).catch(e=>toast('Erreur : '+e.message,true)))};
  $('mCorps').innerHTML=`<input id="mQ" class="ed" style="border-color:var(--trait);margin:0 0 10px;width:100%" placeholder="Rechercher une affaire, un client…"><div id="mListe"></div>`;
  $('mPied').innerHTML=`<button class="btn" onclick="fermerModal()">Annuler</button>`;
  dessiner('');$('mQ').oninput=e=>dessiner(e.target.value);$('mQ').focus();
}
async function fenetreBL(cde){
  const n=txt(cde['N° affaire']);
  ouvrirModal('Créer un BL – '+n,'<div class="charge">Préparation des lignes…</div>','');
  const [BL,ARC,LBL,LARC,DV,LDV]=await Promise.all([MODS.bl.t,MODS.arc.t,T_LBL,T_LARC,MODS.devis.t,T_LDV].map(t=>charger(t).catch(()=>[])));
  const arc=ARC.find(a=>ids(a.Affaire).includes(cde.id))||ARC.find(a=>txt(a['N° ARC'])==='ARC-'+n);
  const dv=DV.find(d=>ids(d.Commande).includes(cde.id))||DV.find(d=>txt(d['N° devis'])===n);
  const ord=(a,b)=>(+a.Ordre||0)-(+b.Ordre||0)||a.id-b.id;
  const src=arc?LARC.filter(l=>ids(l.ARC).includes(arc.id)):dv?LDV.filter(l=>ids(l.Devis).includes(dv.id)):[];
  src.sort(ord);
  const prec=BL.filter(b=>String(txt(b['N° BL'])).startsWith('BL-'+n+'-')&&!/annul/i.test(txt(b.Statut)));
  const deja={};for(const b of prec)for(const l of LBL.filter(x=>ids(x.BL).includes(b.id)))deja[l.Description]=(deja[l.Description]||0)+(+l['Quantité livrée']||0);
  const lignes=src.map(l=>{const c=+l['Quantité']||0,d=deja[l.Description]||0;return{l,c,d,reste:Math.max(0,c-d)}}).filter(x=>x.reste>0||!prec.length);
  const suf=Math.max(0,...BL.map(b=>String(txt(b['N° BL']))).filter(x=>x.startsWith('BL-'+n+'-')).map(x=>+x.split('-').pop()||0))+1;
  const num=`BL-${n}-${String(suf).padStart(2,'0')}`;
  if(!src.length){$('mCorps').innerHTML=`<div class="vide">Aucune ligne trouvée : ni ARC (ARC-${esc(n)}) ni devis ${esc(n)} avec des lignes.<br>Créez le BL dans l’éditeur.</div>`;$('mPied').innerHTML=`<button class="btn" onclick="fermerModal()">Fermer</button><a class="btn p" href="${EDITEUR}?bl=" target="_blank">Ouvrir l’éditeur</a>`;return}
  if(!lignes.length){$('mCorps').innerHTML=`<div class="vide">Tout est déjà livré pour ${esc(n)} (${prec.length} BL).</div>`;$('mPied').innerHTML=`<button class="btn" onclick="fermerModal()">Fermer</button>`;return}
  $('mCorps').innerHTML=`<div class="mut" style="margin-bottom:8px">${esc(num)} · ${esc(txt(cde.Client))} · lignes reprises ${arc?'de l’'+esc(txt(arc['N° ARC'])):'du devis '+esc(n)}${prec.length?` · ${prec.length} BL précédent(s)`:''}</div>
   <table class="l"><thead><tr><th style="cursor:default">Désignation</th><th class="n" style="cursor:default">Commandé</th><th class="n" style="cursor:default">Déjà livré</th><th class="n" style="cursor:default">À livrer</th></tr></thead><tbody>
   ${lignes.map((x,i)=>`<tr style="cursor:default"><td style="white-space:normal">${esc(txt(x.l.Description))}${x.l['Précisions']?`<div class="mut" style="font-size:12px">${esc(String(txt(x.l['Précisions'])).split('\n')[0]).slice(0,80)}</div>`:''}</td><td class="n">${nb(x.c)}</td><td class="n">${nb(x.d)}</td><td class="n"><input type="number" min="0" step="any" data-i="${i}" value="${x.reste}" style="width:80px;text-align:right;border:1px solid var(--trait);border-radius:6px;padding:4px 6px"></td></tr>`).join('')}
   </tbody></table>
   <label style="display:flex;gap:8px;align-items:center;margin-top:12px;font-size:13px"><input type="checkbox" id="blLiv"> Passer la commande à « Livrée » (si tout est livré avec ce BL)</label>`;
  $('mPied').innerHTML=`<button class="btn" onclick="fermerModal()">Annuler</button><button class="btn" id="blTout">Tout le reste</button><button class="btn p" id="blOk">Créer le BL</button>`;
  const ins=[...$('mCorps').querySelectorAll('input[data-i]')];
  const complet=()=>lignes.every((x,i)=>(+ins[i].value||0)>=x.reste);
  const maj=()=>{$('blLiv').checked=complet();$('blOk').textContent=complet()?'Créer le BL complet':'Créer le BL partiel'};
  ins.forEach(i=>i.oninput=maj);maj();
  $('blTout').onclick=()=>{ins.forEach((e,i)=>e.value=lignes[i].reste);maj()};
  $('blOk').onclick=async()=>{
    const q=ins.map(e=>Math.max(0,+e.value||0));if(!q.some(x=>x>0))return toast('Aucune quantité à livrer',true);
    $('blOk').disabled=true;$('blOk').textContent='Création…';
    try{
      const ex=await api(`/rows/table/${MODS.bl.t}/?user_field_names=true&size=1&filter__N° BL__equal=${encodeURIComponent(num)}`);
      if(ex.count)throw new Error(num+' existe déjà (créé entre-temps ?) – rechargez');
      const corps={'N° BL':num,'Statut':'Brouillon','Version':1,'Date':auj(),Affaire:[cde.id],Client:ids(cde.Client),'Référent KTE':ids(cde['Référent KTE']),
        'N° commande client':txt(arc?.['N° commande client'])||txt(cde['N° Cde Client'])||'','Adresse de livraison':txt(arc?.['Adresse de livraison'])||txt(cde['Adresse de livraison'])||''};
      if(arc)corps.ARC=[arc.id];
      const bl=await api(`/rows/table/${MODS.bl.t}/?user_field_names=true`,{method:'POST',body:JSON.stringify(corps)});
      const items=lignes.map((x,i)=>({Description:x.l.Description,'Précisions':x.l['Précisions']||'',Rep:x.l.Rep??'',Vignette:(x.l.Vignette||[]).map(f=>({name:f.name})),
        'Quantité commandée':x.c,'Déjà livré':x.d,'Quantité livrée':q[i],Ordre:i+1,BL:[bl.id]}));
      const scL=sch(T_LBL);for(const it of items)for(const k of Object.keys(it))if(scL.fields.length&&!scL.par[k])delete it[k];
      await api(`/rows/table/${T_LBL}/batch/?user_field_names=true`,{method:'POST',body:JSON.stringify({items})});
      if($('blLiv').checked){const o=sch(MODS.commandes.t).par.Statut?.select_options?.find(x=>/^livr/i.test(x.value));if(o){const r=await api(`/rows/table/${MODS.commandes.t}/${cde.id}/?user_field_names=true`,{method:'PATCH',body:JSON.stringify({Statut:o.id})});majRow(MODS.commandes.t,r);if(SALE?.row?.id===cde.id)SALE.row=r}}
      [MODS.bl.t,T_LBL,MODS.commandes.t].forEach(t=>delete S.prom[t]);
      $('mTitre').textContent=num+' créé';
      $('mCorps').innerHTML=`<div style="padding:10px 0">Le BL <b>${esc(num)}</b> est créé en brouillon (${items.length} ligne(s), ${q.reduce((a,b)=>a+b,0)} pièce(s)).<br>Ouvrez-le dans l’éditeur pour le vérifier, le valider et faire le PDF.</div>`;
      $('mPied').innerHTML=`<button class="btn" onclick="fermerModal();route()">Fermer</button><a class="btn p" href="${EDITEUR}?bl=${encodeURIComponent(num)}" target="_blank" onclick="setTimeout(()=>{fermerModal();route()},300)">${ico('ext')}Ouvrir le BL dans l’éditeur</a>`;
      toast(num+' créé');
    }catch(e){toast('Échec : '+e.message,true);$('blOk').disabled=false;maj()}
  };
}

/* ---------- Tâches et fiches atelier créées à la main depuis une commande (28/10/2026) ----------
   Bouton vert « Tâche / fiche atelier » de la fiche commande (et boutons de son onglet Tâches) → fenêtre à deux volets :
   - Tâche : type (catalogue → libellé « <affaire> – <type> » + référent par défaut), libellé, référent, échéance, statut,
     pièces de la synthèse (cases à cocher → lien « Synthèse commande »), notes. Une tâche est toujours rattachée à la commande.
   - Fiche atelier : métier Fraisage / Tournage / Fraisage Fil / Achats, tâche liée (existante ou nouvelle), délais, référent,
     gravure (Non / Oui obligatoire pour la fabrication), observations facultatives.
     Lignes = TOUTES les lignes de l'affaire (lignes de l'ARC, sinon du devis, puis pièces de la synthèse non reprises),
     rien n'est coché : on coche celles de la fiche (+ « Tout cocher », « Cocher l'étape … ») et on peut ajouter des lignes.
     Vignette de chaque ligne (Vignette PDF / Vignette des lignes de devis ou d'ARC, par repère pour la synthèse), sinon
     vignette de l'affaire (première vignette de ses lignes) ; chaque vignette peut être remplacée par une image.
     Dates saisies en jj/mm/aaaa (champDate). PDF jsPDF au format des fiches (couleur du métier sur le titre et l'en-tête du
     tableau, sans aplat, colonne Visuel, « Page x/N » + « Suite au verso → »), déposé dans <Dossier SharePoint>/05_Commande/
     Fiches atelier/FA_<affaire>_<Métier>.pdf (+ .json), lien écrit dans les Notes de la tâche. Document interne, sans prix.
   Réouverture (29/10/2026) : toute fiche FA_*.pdf du dossier « Fiches atelier » de l'affaire peut être rouverte et modifiée
   (sélecteur « Fiche » de la fenêtre, crayon dans « Documents de l'affaire », bouton « Modifier une fiche » de l'onglet Tâches,
   crayon à côté de la fiche sur la page d'une tâche). Données relues dans FA_<affaire>_<Métier>.json (Akteev) sinon dans
   FA_<affaire>.json (compétence « fiches atelier », entrée du métier, mise à jour en place pour garder les RC cohérents).
   Le PDF est remplacé au même nom (historique des versions SharePoint), en-tête « modifiée », tâche liée : note + échéance. */
const FA_METIERS={
  'Fraisage':{coul:[31,95,168],etape:/^fraisage$/i,fic:'Fraisage',cat:/^fraisage$/i},
  'Tournage':{coul:[46,125,50],etape:/^tournage$/i,fic:'Tournage',cat:/^tournage$/i},
  'Fraisage Fil':{coul:[217,108,0],etape:/^fraisage fil$/i,fic:'Fraisage_Fil',cat:/^fraisage fil$/i},
  'Achats':{coul:[106,61,154],etape:/^achat composant/i,fic:'Achats_standards',cat:/^achat/i,achats:true}};
let FT=null; // état de la fenêtre {cde,mode,lignes,…}
const faChamp=(lab,html,plein)=>`<div${plein?' style="grid-column:1/-1"':''}><label>${lab}</label>${html}</div>`;
const faSel=(id,opts,v)=>`<select id="${id}">${opts.map(([val,lab])=>`<option value="${esc(val)}" ${String(val)===String(v??'')?'selected':''}>${esc(lab)}</option>`).join('')}</select>`;
const faDate=(id,v)=>champDate(`id="${id}" style="margin-left:0"`,v||'',false);
/* Vignette d'une ligne de devis / d'ARC : « Vignette PDF » (data URI) sinon le fichier « Vignette » */

async function faChargerSP(E){
  const url=String(E.cde['Dossier SharePoint']||'');if(!/^https?:/.test(url)){E.sp={absent:true};return}
  E.sp={charge:true};

  const lister=async p=>{try{return(await graph(j,`/drives/${drive}/items/${dos.id}:/${p}:/children?$top=500`)).value||[]}catch(e){if(e.status===404)return[];throw e}};
  const [F,V]=await Promise.all([lister('05_Commande/Fiches atelier'),lister('05_Commande/Fiches atelier/Vignettes')]);
  E.sp={drive,dosId:dos.id,cache:new Map(),
    fiches:F.filter(f=>/^FA_.+\.pdf$/i.test(f.name)).sort((a,b)=>a.name.localeCompare(b.name)),
    json:F.filter(f=>/^FA_.+\.json$/i.test(f.name)&&f['@microsoft.graph.downloadUrl']),
    vig:V.filter(f=>/\.(png|jpe?g)$/i.test(f.name)&&f['@microsoft.graph.downloadUrl']).sort((a,b)=>a.name.localeCompare(b.name))};
  faRedessiner(E);

}
const faLireVig=(E,f)=>{const C=E.sp.cache;if(!C.has(f.id))C.set(f.id,fetch(f['@microsoft.graph.downloadUrl']).then(r=>r.blob()).then(faReduireImage).catch(()=>''));return C.get(f.id)};
async function faAppliquerVignettes(E){
  const V=E.sp?.vig||[];if(!V.length)return;
  const reps=f=>{const m=f.name.match(/_Rep(\d+)(?:-(\d+))?(?=[_.])/i);if(!m)return[];const a=+m[1],b=m[2]?+m[2]:a;const o=[];for(let i=a;i<=Math.min(b,a+50);i++)o.push(String(i));return o};
  let n=0;
  for(const l of [...E.lignes,...E.aff]){if(l.vig)continue;
    let f=l.vigNom?V.find(x=>x.name===l.vigNom):null;
    if(!f){const r=faNumRep(l.rep)[0];if(r)f=V.find(x=>reps(x).includes(r))}

        mat:x.matiere||'',trait:x.traitement||'',dim:x.dimensions||'',four:x.fournisseur||'',pour:x.pour||'',aide:'',vig:'',vigNom:x.vignette||'',sy:[],etapes:[],coche:true};

function faReduireImage(f){return new Promise((ok,ko)=>{const r=new FileReader();r.onerror=()=>ko(new Error('lecture'));r.onload=()=>{const im=new Image();im.onerror=()=>ko(new Error('format'));

    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/png'))};im.src=r.result};r.readAsDataURL(f)})}

async function faImage(src){if(!src)return null;

    const im=await new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ko;i.src=d});
    if(!/^data:image\/(png|jpe?g)/i.test(d)){const c=document.createElement('canvas');c.width=im.width;c.height=im.height;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0);d=c.toDataURL('image/png')}

/* ---------- Comptes : fichier akteev-acces.json (jetons chiffrés, publiable) ----------
   Chaque utilisateur : {login, nom, profil, referent, iter, sel, iv, jeton} ; jeton = jeton Baserow du profil chiffré
   AES-GCM avec une clé PBKDF2-SHA256 (600 000 itérations) tirée de son mot de passe. Aucun secret en clair. */
let ACCES=null;
const FICHIER_ACCES='akteev-acces.json';
async function lireAcces(){try{const r=await fetch(FICHIER_ACCES+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)return null;return await r.json()}catch(e){return null}}
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
const deb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const normLogin=s=>norm(s).trim().replace(/\s+/g,'.');
async function cle(mdp,sel,iter){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(mdp),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:sel,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function chiffrer(jeton,mdp){const sel=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),iter=600000;
  const c=await crypto.subtle.encrypt({name:'AES-GCM',iv},await cle(mdp,sel,iter),new TextEncoder().encode(jeton));return{iter,sel:b64(sel),iv:b64(iv),jeton:b64(c)}}
async function dechiffrer(u,mdp){const c=await crypto.subtle.decrypt({name:'AES-GCM',iv:deb64(u.iv)},await cle(mdp,deb64(u.sel),u.iter||600000),deb64(u.jeton));return new TextDecoder().decode(c)}
async function testerJeton(j){const r=await fetch(API+`/rows/table/${MODS.taches.t}/?user_field_names=true&size=1`,{headers:{Authorization:'Token '+j}});if(!r.ok)throw new Error('jeton refusé par Baserow ('+r.status+')')}
function ecranConnexion(){
  document.body.classList.add('deconnecte');
  $('main').innerHTML=`<div class="card" id="cfg"><div class="marque" style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><span style="display:grid;place-items:center;width:34px;height:34px;border-radius:8px;background:var(--accent);color:#fff;font-weight:700">A</span><h1>Akteev</h1></div>
   <p class="mut">Connexion à l’interface de gestion KTE.</p>
   <label>Identifiant</label><input id="cxL" autocomplete="username" autocapitalize="none">
   <label>Mot de passe</label><input id="cxM" type="password" autocomplete="current-password">
   <button class="btn p" id="cxOk" style="margin-top:16px;width:100%;justify-content:center">Se connecter</button>
   <p style="margin-top:18px;font-size:12px"><a href="#" id="cxJ">Connexion avec un jeton Baserow (administrateur)</a></p></div>`;
  const go=async()=>{const l=normLogin($('cxL').value),m=$('cxM').value;if(!l||!m)return;
    const u=(ACCES?.utilisateurs||[]).find(x=>x.login===l);$('cxOk').disabled=true;$('cxOk').textContent='Vérification…';
    try{if(!u)throw new Error('x');let j;try{j=await dechiffrer(u,m)}catch(e){throw new Error('x')}
      await testerJeton(j);
      JETON=j;SESSION={login:u.login,nom:u.nom,profil:u.profil,referent:u.referent||null};
      try{localStorage.setItem(CLE,j);localStorage.setItem('akteev_session',JSON.stringify(SESSION))}catch(e){}
      MOI=SESSION.referent||MOI;ls.set('moi',MOI);$('toast').innerHTML='';for(const t in S.prom)delete S.prom[t];location.hash='#/accueil';lancer()}
    catch(e){toast(e.message==='x'?'Identifiant ou mot de passe incorrect':'Connexion impossible : '+e.message,true);$('cxOk').disabled=false;$('cxOk').textContent='Se connecter'}};
  $('cxOk').onclick=go;$('cxM').onkeydown=e=>{if(e.key==='Enter')go()};$('cxL').focus();
  $('cxJ').onclick=e=>{e.preventDefault();config()};

/* ---------- Droits d'accès par onglet (administrateur, avec la passerelle) ----------
   Table Baserow « Droits Akteev » : une ligne par profil (Nom = Commercial / Atelier) et une par personne ayant
   des exceptions (Nom = e-mail). Droits = « devis:E nc:L stats:N … ». La passerelle applique ces niveaux (cache 1 min) ;
   les règles fixes (colonnes cachées à l'atelier, fournisseurs Chine) restent en plus. Direction / Admin : tout. */
const T_DROITS=1285300;
const ONGLETS_ACCES=[
 ['devis','Devis','avec les lignes de devis'],['consult','Consultations SST / DDP','avec les prix SST'],['commandes','Commandes',''],
 ['arc','ARC','avec les lignes'],['bl','Bons de livraison','avec les lignes'],['clients','Clients',''],['taches','Tâches',''],
 ['synthese','Synthèse pièces',''],['nc','Non-conformités','et Synthèse NC'],['cf','Commandes fournisseurs','avec les lignes'],
 ['fournisseurs','Fournisseurs',''],['referents','Référents','nécessaire aux tâches et à « Je suis »'],['catalogue','Catalogue de tâches',''],['stats','Statistiques','onglet pas encore réactivé']];
const PROFILS_ACCES=[['commercial','Commercial'],['atelier','Atelier']];
/* Niveaux par défaut (= ceux codés dans la passerelle quand rien n'est réglé). */
const DEF_ACCES={commercial:{devis:'E',consult:'E',commandes:'E',arc:'E',bl:'E',clients:'E',taches:'E',synthese:'E',nc:'E',cf:'E',fournisseurs:'E',referents:'E',catalogue:'E',stats:'N'},
 atelier:{devis:'N',consult:'E',commandes:'L',arc:'N',bl:'L',clients:'L',taches:'E',synthese:'E',nc:'E',cf:'E',fournisseurs:'L',referents:'L',catalogue:'E',stats:'N'}};

const lireNiv=s=>{const o={};for(const m of String(s||'').replace(/\\/g,'').matchAll(/([a-z]+)\s*[:=]\s*([ELN])/gi)){const k=m[1].toLowerCase();if(ONGLETS_ACCES.some(x=>x[0]===k))o[k]=m[2].toUpperCase()}return o};
const ecrireNiv=o=>ONGLETS_ACCES.filter(([k])=>o[k]).map(([k])=>k+':'+o[k]).join(' ');
const profilCle=r=>({'Direction / Admin':'admin','Commercial':'commercial','Atelier':'atelier'})[txt(r?.Profil)]||null;
const nomDroit=r=>String(r?.Nom||'').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
let BR_ACCES=null; // brouillon {profils:{commercial:{…},atelier:{…}}, personnes:{email:{…}}, u:email sélectionné}

  document.title='Akteev – Droits d’accès';actif('droits');

    for(const r of D){const n=nomDroit(r);if(n.includes('@'))b.personnes[n]=lireNiv(r.Droits)}
    b.u=p.u||BR_ACCES?.u||'';BR_ACCES=b;BR_ACCES.orig=JSON.stringify({profils:b.profils,personnes:b.personnes})}
  dessinerDroits(U)}

  const u=pers.find(r=>String(r['E-mail']).trim().toLowerCase()===B.u)||null,pu=u?profilCle(u):null,ex=u?(B.personnes[B.u]||{}):{};
  const nbEx=e=>Object.keys(B.personnes[e]||{}).length;
  let h=`<div class="entete"><a class="btn" href="#/utilisateurs" title="Retour aux utilisateurs">${ico('retour')}</a><h1>Droits d’accès</h1><span class="sous">par onglet et par profil</span><div class="act">

   Règles fixes conservées quel que soit le réglage : l’atelier ne voit pas les montants des commandes, seulement Code / Entreprise des clients, ni les prix des fournisseurs en Chine.</p>
