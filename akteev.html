<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Akteev – KTE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --side:#17233A;--side2:#1F2E4A;--sideTxt:#AEB9CC;--accent:#2F6FED;--accentL:#E8F0FE;--kte:#2B4C7E;
  --bg:#F3F5F9;--card:#fff;--txt:#1C2433;--mut:#6B7385;--trait:#E3E7EE;--hover:#F6F8FB;
  --ok:#16A34A;--warn:#D97706;--err:#DC2626;--r:10px;--sh:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08)
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--txt);background:var(--bg);display:flex}
a{color:var(--accent);text-decoration:none}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
/* ---------- Menu gauche ---------- */
#side{width:232px;flex:none;background:var(--side);color:var(--sideTxt);display:flex;flex-direction:column;height:100vh;position:sticky;top:0;overflow-y:auto}
#side .marque{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;color:#fff;font-weight:700;font-size:17px;letter-spacing:.2px}
#side .marque span.k{display:grid;place-items:center;width:32px;height:32px;border-radius:8px;background:var(--accent);font-size:15px}
#side .marque small{display:block;font-weight:500;font-size:11px;color:var(--sideTxt);letter-spacing:0}
#side .grp{padding:14px 18px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:#6F7D96;font-weight:600}
#side a.it{display:flex;align-items:center;gap:11px;margin:1px 10px;padding:8px 10px;border-radius:8px;color:var(--sideTxt);font-weight:500;position:relative}
#side a.it:hover{background:var(--side2);color:#fff}
#side a.it.on{background:var(--accent);color:#fff}
#side a.it svg{width:18px;height:18px;flex:none;opacity:.9}
#side a.it .nb:empty{display:none}
#side a.it .nb{margin-left:auto;font-size:11px;background:rgba(255,255,255,.12);padding:1px 7px;border-radius:10px}
#side a.it.on .nb{background:rgba(255,255,255,.25)}
#side .bas{margin-top:auto;padding:14px 18px;border-top:1px solid #26354F;font-size:12px}
#side .bas select{width:100%;margin-top:5px;background:var(--side2);border:1px solid #2C3D5C;color:#fff;border-radius:6px;padding:5px}
#side .bas a{color:var(--sideTxt);display:block;margin-top:8px}
#side .bas a:hover{color:#fff}
/* ---------- Zone principale ---------- */
#wrap{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh;overflow:hidden}
#top{height:58px;flex:none;background:#fff;border-bottom:1px solid var(--trait);display:flex;align-items:center;gap:14px;padding:0 24px}
#top .burger{display:none;border:0;background:none;padding:4px}
#gsearch{position:relative;flex:1;max-width:520px}
#gsearch input{width:100%;border:1px solid var(--trait);background:var(--bg);border-radius:8px;padding:8px 12px 8px 34px;outline:none}
#gsearch input:focus{border-color:var(--accent);background:#fff}
#gsearch svg{position:absolute;left:10px;top:9px;width:16px;height:16px;color:var(--mut)}
#gres{position:absolute;top:40px;left:0;right:0;background:#fff;border:1px solid var(--trait);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);max-height:420px;overflow:auto;display:none;z-index:50}
#gres a{display:flex;gap:10px;padding:8px 12px;color:var(--txt);border-bottom:1px solid var(--hover)}
#gres a:hover,#gres a.sel{background:var(--accentL)}
#gres .ty{font-size:11px;color:var(--mut);width:90px;flex:none;padding-top:1px}
#top .droite{margin-left:auto;display:flex;align-items:center;gap:10px;color:var(--mut);font-size:12px}
#main{flex:1;overflow:auto;padding:22px 26px 60px}
/* ---------- Éléments communs ---------- */
h1{font-size:21px;margin:0;font-weight:700}
.entete{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.entete .sous{color:var(--mut);font-size:13px}
.entete .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--trait);background:#fff;border-radius:8px;padding:7px 13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;color:var(--txt);white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.p{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.p:hover{filter:brightness(.95)}
.btn.d{color:var(--err)}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:15px;height:15px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid #EAEDF2}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:500;white-space:nowrap;line-height:18px}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
.chip{display:inline-block;background:#EEF1F6;border-radius:5px;padding:1px 7px;margin:1px 3px 1px 0;font-size:12.5px;color:var(--txt);white-space:nowrap}
a.chip:hover{background:var(--accentL);color:var(--accent)}
.mut{color:var(--mut)}
.retard{color:var(--err);font-weight:600}
.vide{padding:40px;text-align:center;color:var(--mut)}
/* ---------- Barre d'outils de liste ---------- */
.outils{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--trait)}
.outils .rech{position:relative}
.outils .rech input{border:1px solid var(--trait);border-radius:7px;padding:6px 10px 6px 30px;width:240px;outline:none}
.outils .rech input:focus{border-color:var(--accent)}
.outils .rech svg{position:absolute;left:9px;top:8px;width:14px;height:14px;color:var(--mut)}
.outils select{border:1px solid var(--trait);border-radius:7px;padding:6px 8px;background:#fff;max-width:220px}
.puces{display:flex;gap:6px;flex-wrap:wrap}
.puce{border:1px solid var(--trait);background:#fff;border-radius:20px;padding:4px 11px;font-size:12.5px;color:var(--mut)}
.puce b{font-weight:600;color:var(--txt);margin-left:3px}
.puce.on{background:var(--accentL);border-color:#B8CDF8;color:var(--accent)}
.puce.on b{color:var(--accent)}
.bascule{display:inline-flex;border:1px solid var(--trait);border-radius:7px;overflow:hidden;margin-left:auto}
.bascule button{border:0;background:#fff;padding:6px 10px;color:var(--mut);display:flex;align-items:center;gap:5px}
.bascule button.on{background:var(--accentL);color:var(--accent)}
.bascule svg{width:15px;height:15px}
/* ---------- Tableaux ---------- */
.tw{overflow-x:auto}
table.l{width:100%;border-collapse:collapse}
table.l th{text-align:left;font-size:12px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.3px;padding:9px 12px;border-bottom:1px solid var(--trait);white-space:nowrap;cursor:pointer;user-select:none;background:#FAFBFC;position:sticky;top:0}
table.l th:hover{color:var(--txt)}
table.l th .fl{opacity:.6;font-size:10px}
table.l tr.filtres th{position:static;background:#fff;padding:5px 6px;cursor:default;text-transform:none;letter-spacing:0;font-weight:400}
table.l tr.filtres input,table.l tr.filtres select{width:100%;min-width:70px;border:1px solid var(--trait);border-radius:6px;padding:4px 7px;font-size:12.5px;background:#fff;outline:none;color:var(--txt)}
table.l tr.filtres input:focus,table.l tr.filtres select:focus{border-color:var(--accent)}
table.l tr.filtres .on{border-color:#B8CDF8;background:var(--accentL)}
table.l td{padding:9px 12px;border-bottom:1px solid #EFF1F5;vertical-align:middle;max-width:340px;overflow:hidden;text-overflow:ellipsis}
table.l tbody tr{cursor:pointer}
table.l tbody tr:hover{background:var(--hover)}
table.l td.n,table.l th.n{text-align:right;white-space:nowrap}
table.l td.prim{font-weight:600;color:var(--kte);white-space:nowrap}
table.l tfoot td{font-weight:600;padding:10px 12px;background:#FAFBFC}
.plus{padding:12px;text-align:center}
/* ---------- Kanban ---------- */
.kanban{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.kcol{flex:0 0 272px;background:#EBEEF3;border-radius:var(--r);padding:10px;min-height:120px}
.kcol.over{outline:2px dashed var(--accent);outline-offset:-2px}
.kcol h3{margin:2px 4px 10px;font-size:13px;display:flex;align-items:center;gap:8px}
.kcol h3 .nb{margin-left:auto;color:var(--mut);font-weight:500}
.kcard{background:#fff;border-radius:8px;padding:10px 11px;margin-bottom:8px;box-shadow:var(--sh);cursor:grab;border-left:3px solid transparent}
.kcard:hover{box-shadow:0 2px 8px rgba(0,0,0,.12)}
.kcard .t{font-weight:600;font-size:13px;margin-bottom:4px}
.kcard .m{font-size:12px;color:var(--mut);display:flex;gap:8px;flex-wrap:wrap}
/* ---------- Tableau de bord ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:16px}
.kpi{padding:16px 18px;cursor:pointer}
.kpi:hover{box-shadow:0 2px 10px rgba(0,0,0,.1)}
.kpi .lab{color:var(--mut);font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:7px}
.kpi .lab svg{width:16px;height:16px}
.kpi .val{font-size:26px;font-weight:700;margin-top:6px;letter-spacing:-.5px}
.kpi .det{font-size:12.5px;color:var(--mut);margin-top:2px}
.grille{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr));gap:16px}
.bloc h2{font-size:14.5px;margin:0;padding:14px 16px;border-bottom:1px solid var(--trait);display:flex;align-items:center;gap:8px}
.bloc h2 a{margin-left:auto;font-size:12.5px;font-weight:500}
.ligneDb{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid #F0F2F6;cursor:pointer}
.ligneDb:hover{background:var(--hover)}
.ligneDb .x{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ligneDb .x small{color:var(--mut);margin-left:6px}
/* ---------- Fiche ---------- */
.fiche{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.form{padding:6px 20px 18px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 22px}
.form .ch{padding:9px 0;border-bottom:1px solid #F0F2F6;min-width:0}
.form .ch.plein{grid-column:1/-1}
.form .ch label{display:block;font-size:12px;color:var(--mut);font-weight:500;margin-bottom:4px}
.form .ch label .req{color:var(--err)}
.form .ch .ro{min-height:22px;word-wrap:break-word;white-space:pre-wrap}
.ed{width:100%;border:1px solid transparent;border-radius:6px;padding:5px 7px;margin-left:-7px;background:transparent;outline:none;min-height:32px}
.ed:hover{border-color:var(--trait);background:#fff}
.ed:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accentL)}
textarea.ed{resize:vertical;min-height:60px}
.ed.modif{background:#FFF8E6;border-color:#F5D58A}
.dtw{display:flex;align-items:center;gap:2px;position:relative}
.dtw .ed{flex:1;min-width:0}
.dtw .cal{border:0;background:none;color:var(--mut);padding:4px;display:flex}
.dtw .cal:hover{color:var(--accent)}
.dtw .cal svg{width:17px;height:17px}
.dtw .dtn{position:absolute;right:0;bottom:0;width:1px;height:1px;opacity:0;border:0;padding:0;pointer-events:none}
.ed.invalide{border-color:var(--err)!important;background:#FEF2F2}
.lienEd{display:flex;flex-wrap:wrap;align-items:center;gap:3px;min-height:32px;padding:4px 0}
.lienEd .chip .x{margin-left:5px;color:var(--mut);cursor:pointer}
.lienEd .chip .x:hover{color:var(--err)}
.lienEd button{border:1px dashed var(--trait);background:#fff;border-radius:5px;padding:1px 8px;color:var(--mut);font-size:12px}
.lienEd button:hover{border-color:var(--accent);color:var(--accent)}
.lienEd.modif{background:#FFF8E6;border-radius:6px}
.section{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);font-weight:600;padding:16px 20px 4px;grid-column:1/-1}
details.calc summary{cursor:pointer;padding:12px 20px;color:var(--mut);font-size:13px;font-weight:500}
.cote .card{margin-bottom:14px}
.cote .card h3{font-size:13px;margin:0;padding:12px 14px;border-bottom:1px solid var(--trait)}
.cote .card .c{padding:10px 14px;font-size:13px}
.cote .lien{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid #F0F2F6;color:var(--txt)}
.cote .lien:hover{background:var(--hover)}
.cote .lien svg{width:16px;height:16px;color:var(--accent)}
.onglets{display:flex;gap:2px;border-bottom:1px solid var(--trait);padding:0 12px;overflow-x:auto}
.onglets button{border:0;background:none;padding:11px 12px;color:var(--mut);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.onglets button.on{color:var(--accent);border-bottom-color:var(--accent)}
.onglets button .nb{background:#EEF1F6;border-radius:10px;padding:0 6px;font-size:11px;margin-left:4px}
#barreEnr{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(200px);background:var(--side);color:#fff;border-radius:10px;padding:10px 12px 10px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:transform .2s;z-index:40}
#barreEnr.vis{transform:translateX(-50%) translateY(0)}
#barreEnr .btn{border-color:#3A4B6A;background:transparent;color:#fff}
#barreEnr .btn.p{background:var(--accent);border-color:var(--accent)}
.selStatut{position:relative;display:inline-block}
.selStatut select{position:absolute;inset:0;opacity:0;cursor:pointer}
/* ---------- Fenêtres ---------- */
#modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:flex-start;justify-content:center;padding-top:8vh;z-index:60}
#modal .box{background:#fff;border-radius:12px;width:min(640px,94vw);max-height:80vh;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.3)}
#modal .box h3{margin:0;padding:16px 18px;border-bottom:1px solid var(--trait);font-size:15px;display:flex;align-items:center}
#modal .box h3 button{margin-left:auto;border:0;background:none;font-size:20px;color:var(--mut)}
#modal .box .corps{padding:14px 18px;overflow:auto;flex:1}
#modal .box .pied{padding:12px 18px;border-top:1px solid var(--trait);display:flex;justify-content:flex-end;gap:8px}
.choixL{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:6px;cursor:pointer}
.choixL:hover{background:var(--hover)}
.choixL small{color:var(--mut)}
#toast{position:fixed;right:20px;bottom:20px;z-index:70;display:flex;flex-direction:column;gap:8px}
#toast div{background:#fff;border-left:4px solid var(--ok);box-shadow:0 6px 20px rgba(0,0,0,.15);border-radius:8px;padding:10px 14px;min-width:240px;max-width:420px;animation:entre .2s}
#toast div.err{border-left-color:var(--err)}
@keyframes entre{from{opacity:0;transform:translateX(20px)}}
.charge{display:flex;align-items:center;gap:10px;color:var(--mut);padding:40px;justify-content:center}
.charge::before{content:"";width:18px;height:18px;border:2px solid var(--trait);border-top-color:var(--accent);border-radius:50%;animation:tourne .8s linear infinite}
@keyframes tourne{to{transform:rotate(360deg)}}
.graph{padding:14px 16px 8px}
.graph svg{width:100%;height:auto;display:block}
#cfg{max-width:480px;margin:10vh auto;padding:28px}
body.deconnecte #side,body.deconnecte #top{display:none}
#cfg label{display:block;font-size:12.5px;color:var(--mut);margin-top:10px}
#cfg input,#cfg select{width:100%;border:1px solid var(--trait);border-radius:8px;padding:9px 11px;margin:4px 0 0}
.formU{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 16px;padding:16px}
.formU label{font-size:12px;color:var(--mut);font-weight:500}
.formU input,.formU select{width:100%;border:1px solid var(--trait);border-radius:7px;padding:7px 9px;margin-top:3px}
.droits td{font-size:12.5px}
#cfg input{width:100%;border:1px solid var(--trait);border-radius:8px;padding:9px 11px;margin:12px 0}
/* ---------- Écrans étroits ---------- */
@media (max-width:900px){
  #side{position:fixed;left:-240px;z-index:80;transition:left .2s}
  body.menu #side{left:0;box-shadow:0 0 40px rgba(0,0,0,.4)}
  #top .burger{display:block}
  #main{padding:16px}
  .fiche{grid-template-columns:1fr}
  .form{grid-template-columns:1fr}
  .grille{grid-template-columns:1fr}
  .outils .rech input{width:170px}
}
</style>
</head>
<body>
<nav id="side"></nav>
<div id="wrap">
  <header id="top">
    <button class="burger" onclick="document.body.classList.toggle('menu')" aria-label="Menu"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
    <div id="gsearch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="gq" placeholder="Rechercher un devis, une commande, un client… (touche /)" autocomplete="off"><div id="gres"></div></div>
    <div class="droite"><span id="etat"></span><button class="btn" id="bRafr" title="Recharger les données depuis Baserow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button></div>
  </header>
  <main id="main"></main>
</div>
<div id="barreEnr"><span id="beTxt">Modifications non enregistrées</span><button class="btn" id="beAnn">Annuler</button><button class="btn p" id="beEnr">Enregistrer</button></div>
<div id="modal"><div class="box"><h3><span id="mTitre"></span><button onclick="fermerModal()">×</button></h3><div class="corps" id="mCorps"></div><div class="pied" id="mPied"></div></div></div>
<div id="toast"></div>
<script>
/* =====================================================================
   AKTEEV – interface KTE au-dessus de Baserow (base 592007)
   Même origine que l'éditeur (matthiaskte.github.io/editeur/) :
   le jeton est partagé via localStorage.kte_baserow_jeton.
   Règles : aucune suppression de ligne (on passe le statut à « Annulée ») ;
   devis / ARC / BL se créent et se mettent en page dans l'éditeur.
   ===================================================================== */
const API='https://api.baserow.io/api/database';
const EDITEUR='./';
const CLE='kte_baserow_jeton';
let JETON=null;try{JETON=localStorage.getItem(CLE)}catch(e){}
const ls={get(k,d){try{const v=localStorage.getItem('akteev_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('akteev_'+k,JSON.stringify(v))}catch(e){}}};

/* ---------- Icônes ---------- */
const I={
 accueil:'<path d="M3 11 12 3l9 8"/><path d="M5 10v10h14V10"/>',
 devis:'<path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',
 commandes:'<path d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h9.2a1 1 0 0 0 1-.8L21 8H6"/><circle cx="9" cy="20" r="1.3"/><circle cx="18" cy="20" r="1.3"/>',
 arc:'<path d="M9 12l2 2 4-4"/><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5"/>',
 bl:'<path d="M1 6h13v10H1zM14 10h4l3 3v3h-7"/><circle cx="5" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',
 clients:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14.5c2.4.2 4 1.8 4.5 4.5"/>',
 taches:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 10l2 2 4-4M8 16h8"/>',
 synthese:'<path d="M4 5h16M4 10h16M4 15h10M4 20h6"/>',
 ddp:'<path d="M4 13h4l2 3h4l2-3h4"/><path d="M5.5 6.5 4 13v6h16v-6l-1.5-6.5a1 1 0 0 0-1-.8H6.5a1 1 0 0 0-1 .8z"/>',

/* ---------- API Baserow ---------- */
let ENCOURS=0;const FILE=[];
async function api(path,opt={},essai=0){
  if(ENCOURS>=4)await new Promise(r=>FILE.push(r));ENCOURS++;let r;
  try{r=await fetch(API+path,{...opt,headers:{Authorization:'Token '+JETON,'Content-Type':'application/json',...(opt.headers||{})}})}finally{ENCOURS--;FILE.length&&FILE.shift()()}
  if((r.status===429||r.status>=500)&&essai<4){await new Promise(x=>setTimeout(x,800*(essai+1)));return api(path,opt,essai+1)}
  if(!r.ok){const t=await r.text();let m=t;try{const j=JSON.parse(t);m=(j.error||'')+' '+(j.detail?JSON.stringify(j.detail):'')}catch(e){}throw new Error(r.status+' '+m.slice(0,300))}
  return r.status===204?null:r.json();
}
const S={sch:{},rows:{},prom:{}};
async function tout(t){let out=[],p=1;for(;;){const j=await api(`/rows/table/${t}/?user_field_names=true&size=200&page=${p}`);out=out.concat(j.results);if(!j.next)break;p++}return out}
async function lireChamps(t){try{return await api(`/fields/table/${t}/`)}catch(e){return null}}
function charger(t,force){
  if(force||!S.prom[t]){
    S.prom[t]=Promise.all([S.sch[t]&&!force?Promise.resolve(null):lireChamps(t),tout(t)]).then(([f,rows])=>{
      S.rows[t]=rows;if(f)S.sch[t]=faireSchema(f,false);else if(!S.sch[t]||S.sch[t].deduit)S.sch[t]=deduireSchema(rows);
      majCompteurs();return rows}).catch(e=>{delete S.prom[t];throw e});
  }
  return S.prom[t];
}
function faireSchema(fields,deduit){
  fields.sort((a,b)=>(b.primary?1:0)-(a.primary?1:0)||(a.order??0)-(b.order??0)||a.id-b.id);
  const par={};fields.forEach(f=>par[f.name]=f);
  return{fields,par,prim:(fields.find(f=>f.primary)||fields[0]||{}).name,deduit};
}
function deduireSchema(rows){
  const noms=[];const vus={};
  rows.forEach(r=>Object.keys(r).forEach(k=>{if(k!=='id'&&k!=='order'&&!vus[k]){vus[k]=1;noms.push(k)}}));
  const fields=noms.map((n,i)=>{
    const vals=rows.map(r=>r[n]).filter(v=>v!=null&&v!==''&&!(Array.isArray(v)&&!v.length));
    const f={id:-(i+1),name:n,order:i,primary:i===0,type:'text'};
    const v=vals[0];
    if(v===undefined){f.type='text'}
    else if(typeof v==='boolean')f.type='boolean';
    else if(Array.isArray(v)){
      if(v[0]&&('url' in v[0])&&('visible_name' in v[0]))f.type='file';
      else if(v[0]&&'color' in v[0]){f.type='multiple_select';f.select_options=optsVues(vals.flat())}
      else if(LIENS_SECOURS[n]&&v[0]&&'id' in v[0]){f.type='link_row';f.link_row_table_id=LIENS_SECOURS[n]}
      else f.type='lookup';
    }
    else if(typeof v==='object'&&'color' in v){f.type='single_select';f.select_options=optsVues(vals)}
    else if(typeof v==='object')f.type='formula';
    else if(vals.every(x=>/^\d{4}-\d{2}-\d{2}$/.test(x)))f.type='date';
    else if(vals.every(x=>/^\d{4}-\d{2}-\d{2}T/.test(x))){f.type='date';f.date_include_time=true}
    else if(vals.every(x=>/^-?\d+(\.\d+)?$/.test(String(x)))){f.type='number';f.number_decimal_places=Math.max(0,...vals.map(x=>(String(x).split('.')[1]||'').length))}
    else if(vals.some(x=>String(x).includes('\n')))f.type='long_text';
    else if(vals.every(x=>/^https?:\/\//.test(x)))f.type='url';
    return f});
  return faireSchema(fields,true);
}
function optsVues(vals){const m=new Map();vals.forEach(o=>{if(o&&o.id!=null&&!m.has(o.id))m.set(o.id,{id:o.id,value:o.value,color:o.color})});return[...m.values()]}
const sch=t=>S.sch[t]||{fields:[],par:{},prim:'id'};
const titre=(t,r)=>{const p=sch(t).prim;const v=r?.[p];return txt(v)||('#'+r?.id)};
function txt(v){if(v==null)return'';if(Array.isArray(v))return v.map(txt).filter(Boolean).join(', ');if(typeof v==='object')return v.value!=null?txt(v.value):(v.name||v.visible_name||'');return String(v)}

/* ---------- Rendu d'une valeur ---------- */
function rendu(f,v,court){
  if(v==null||v===''||(Array.isArray(v)&&!v.length))return'<span class="mut">—</span>';
  const ty=f?.type,n=f?.name||'';
  if(ty==='single_select')return badge(v);
  if(ty==='multiple_select')return v.map(badge).join(' ');
  if(ty==='boolean')return v?'<span style="color:var(--ok)">✔</span>':'<span class="mut">—</span>';
  if(ty==='link_row'){const m=MOD_DE_TABLE[f.link_row_table_id];return v.map(x=>m?`<a class="chip" href="#/${m}/${x.id}" onclick="event.stopPropagation()">${esc(x.value)}</a>`:`<span class="chip">${esc(x.value)}</span>`).join('')}
  if(ty==='file')return v.map(x=>x.is_image?`<a href="${esc(x.url)}" target="_blank" onclick="event.stopPropagation()"><img src="${esc(x.thumbnails?.tiny?.url||x.url)}" style="height:${court?24:60}px;border-radius:4px;margin-right:4px;vertical-align:middle"></a>`:`<a href="${esc(x.url)}" target="_blank">${esc(x.visible_name)}</a>`).join(' ');
  if(ty==='date'||ty==='created_on'||ty==='last_modified')return f.date_include_time||ty!=='date'?esc(dtfr(v)):esc(dfr(v));
  if(ty==='number'||ty==='count'||ty==='rating'||((ty==='formula'||ty==='rollup')&&typeof v!=='object'&&/^-?\d+(\.\d+)?$/.test(String(v)))){return estMonnaie(n)?eur(v):nb(v)}
  if(ty==='url'||(typeof v==='string'&&/^https?:\/\/\S+$/.test(v)))return`<a href="${esc(v)}" target="_blank" onclick="event.stopPropagation()">${court?'Ouvrir ↗':esc(v.length>60?v.slice(0,57)+'…':v)}</a>`;
  if(ty==='email')return`<a href="mailto:${esc(v)}" onclick="event.stopPropagation()">${esc(v)}</a>`;
  if(Array.isArray(v))return v.map(x=>typeof x==='object'&&x&&'color' in x?badge(x):`<span class="chip">${esc(txt(x))}</span>`).join('');
  if(typeof v==='object'&&'color' in v)return badge(v);
  const s=txt(v);
  if(court&&s.length>90)return esc(s.slice(0,88))+'…';
  if(/^\d{4}-\d{2}-\d{2}/.test(s))return esc(s.length>10?dtfr(s):dfr(s));
  return esc(s);
}
function triVal(f,v){
  if(v==null||v==='')return null;const ty=f?.type;
  if(ty==='number'||ty==='count'||(typeof v==='string'&&/^-?\d+(\.\d+)?$/.test(v)))return+v;
  if(typeof v==='object'&&!Array.isArray(v)&&'color' in v){const o=(f?.select_options||[]).findIndex(x=>x.id===v.id);return o>=0?o:norm(v.value)}
  return norm(txt(v));
}

function graphe(C,dateCde){

/* ---------- DDP en cours (demandes de prix en consultation chez les sous-traitants) ----------
   Une DDP = un devis au statut Brouillon ou Consultation SST. Ses consultations viennent de la table
   « Consultations SST » (une ligne par sous-traitant consulté). Réponses = offres reçues + refus. */
const DDP_STATUTS=['Brouillon','Consultation SST'];
const DDP_ETATS=[['complet','Toutes les réponses'],['partiel','Réponses partielles'],['aucune','Aucune réponse'],['sans','Pas encore consulté']];
function delaiRelance(iso){const j=new Date(iso).getDay();return(j>=4&&j<=6?96:48)*36e5} // jeudi, vendredi, samedi : 96 h
function ddpConsult(c){
  const rep=txt(c['Réponse'])||'En attente',base=c['Dernière relance']||c['Envoyée le'];
  const relance=rep==='En attente'&&base&&Date.now()-new Date(base)>delaiRelance(base);
  return{c,rep,relance,four:txt(c.Fournisseur)||txt(c['Réf']).replace(/^\S+\s*[–-]\s*/,'')||'?'}}
function ddpListe(D,CS){
  const par=new Map();(CS||[]).forEach(c=>{if(txt(c['Réponse'])==='Annulée')return;ids(c.Devis).forEach(i=>{if(!par.has(i))par.set(i,[]);par.get(i).push(c)})});
  return(D||[]).filter(d=>DDP_STATUTS.includes(txt(d.Statut))).map(d=>{
    const C=(par.get(d.id)||[]).map(ddpConsult).sort((a,b)=>String(a.c['Envoyée le']||'').localeCompare(String(b.c['Envoyée le']||''))||a.four.localeCompare(b.four,'fr'));
    const tot=C.length,off=C.filter(x=>x.rep==='Offre reçue'),ref=C.filter(x=>x.rep==='Refus').length,rep=off.length+ref;
    const etat=!tot?'sans':rep===tot?'complet':rep?'partiel':'aucune';
    const prix=off.filter(x=>x.c.Montant!=null&&x.c.Montant!==''&&(!x.c.Devise||/^(eur|€)$/i.test(x.c.Devise))).sort((a,b)=>+a.c.Montant-+b.c.Montant)[0];
    return{d,C,tot,rep,ref,etat,prix,relances:C.filter(x=>x.relance).length}});
}
function badgeReponses(x){
  if(!x.tot)return'<span class="badge" style="background:#F3F4F6;color:#6B7280">—</span>';
  const [bg,fg]={complet:['#DCFCE7','#15803D'],partiel:['#FFEDD5','#C2410C'],aucune:['#FEE2E2','#B91C1C']}[x.etat];
  return`<span class="badge" style="background:${bg};color:${fg};font-size:13.5px;font-weight:700;padding:3px 11px" title="${x.rep} réponse(s) sur ${x.tot} sous-traitant(s) consulté(s)">${x.rep}/${x.tot}</span>${x.ref?`<div class="mut" style="font-size:11.5px;margin-top:2px">dont ${x.ref} refus</div>`:''}`}
function puceSST(x){
  const c=x.c,[ic,bg,fg]={'Offre reçue':['✔','#DCFCE7','#15803D'],'Refus':['✕','#FEE2E2','#B91C1C'],'Question':['?','#FFEDD5','#C2410C']}[x.rep]||['⏳','#EEF0F4','#4B5563'];
  const det=[x.four+' : '+x.rep,c['Envoyée le']?'consulté le '+dtfr(c['Envoyée le']):'',c['Réponse le']?'réponse le '+dtfr(c['Réponse le']):'',
    c.Montant!=null&&c.Montant!==''?'montant '+(c.Devise&&!/^(eur|€)$/i.test(c.Devise)?nb(c.Montant)+' '+c.Devise:eur(c.Montant)):'',c['Délai']?'délai '+c['Délai']:'',
    c['Dernière relance']?'relancé le '+dtfr(c['Dernière relance']):'',x.relance?'⚠ relance à faire':'',txt(c.Commentaire)].filter(Boolean).join('\n');
  return`<a class="chip" href="#/consult/${c.id}" onclick="event.stopPropagation()" title="${esc(det)}" style="background:${bg};color:${fg};${x.relance?'box-shadow:inset 0 0 0 1.5px #DC2626;':''}">${ic} ${esc(x.four)}${x.relance?' · relance':''}</a>`}
/* Date de réception en rouge si le devis n'est pas répondu sous 48 h ouvrées (samedi et dimanche exclus) :
   le compte part du jour de réception (ou du lundi si reçue le week-end) ; rouge à partir du 2e jour ouvré suivant. */
function plusJoursOuvres(iso,n){const d=new Date(iso.slice(0,10)+'T12:00');while(d.getDay()===0||d.getDay()===6)d.setDate(d.getDate()+1);
  for(let i=0;i<n;){d.setDate(d.getDate()+1);if(d.getDay()!==0&&d.getDay()!==6)i++}return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
function dateReception(d){const v=d['Date réception']||d.Date;if(!v)return'<span class="mut">—</span>';
  const lim=plusJoursOuvres(v,2),ret=auj()>=lim;
  return`<span ${ret?'class="badge" style="background:#FEE2E2;color:#B91C1C;font-size:13px;font-weight:700;padding:3px 10px"':'style="white-space:nowrap"'} title="${ret?'Pas de réponse au client sous 48 h ouvrées (échéance le '+dfr(lim)+')':'Réponse attendue avant le '+dfr(lim)}">${dfr(v)}</span>`}

  </div><div class="tw"><table class="l"><thead><tr><th style="cursor:default">Réponses</th><th style="cursor:default">N° devis</th><th style="cursor:default">Client</th><th style="cursor:default">Objet</th><th style="cursor:default">Sous-traitants consultés</th>${montants()?'<th class="n" style="cursor:default">Meilleure offre</th>':''}<th style="cursor:default">Reçue le</th><th style="cursor:default">Référent</th><th style="cursor:default">Statut</th></tr></thead><tbody>`;

/* ---------- Statistiques (données comptables Axonaut) ----------
   Table Baserow « Stats Axonaut » (T_STATS) : une ligne par mois (« 2026-01 »…, plus « Avant 2026 » pour les
   commandes fournisseurs antérieures d'affaires facturées dans l'année). Remplie par la tâche planifiée
   « Stats Axonaut → Akteev » (API Axonaut, le navigateur ne peut pas l'appeler directement : CORS).
   Colonnes JSON : Factures [n°, date, id client, client, affaire, nom commande, HT, TTC, reste dû, échéance, payée le, commercial, id]
   Commandes [affaire, nom, date, id client, client, HT, livraison prévue, nb factures, id]
   Achats (commandes fournisseurs) [affaire, titre, date, fournisseur, HT, id]
   Dépenses (factures fournisseurs) [date, fournisseur, réf, HT, catégorie, payée, id]
   Marge sur achats d'une affaire = CA facturé − commandes fournisseurs de l'affaire ; pour une période, les achats
   sont imputés au prorata du facturé (taux d'achat = achats / max(commandé, facturé total)). */
const T_STATS=1277595;
const STATS_ACTIF=false; // onglet en attente : à réactiver quand les identifiants / mots de passe seront en place
const STATS_COUL={ca:'#2F6FED',cde:'#9DBBF7',marge:'#16A34A',achats:'#F59E0B',dep:'#DC2626'};
const MOIS_COURT=m=>new Date(m+'-01T00:00').toLocaleDateString('fr-FR',{month:'short'}).replace('.','');
const MOIS_LONG=m=>new Date(m+'-01T00:00').toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
const pct=x=>isFinite(x)?(Math.round(x*1000)/10).toLocaleString('fr-FR')+' %':'—';
let STV=ls.get('stv',{o:'mois',du:'',au:'',q:'',mat:false});
const STRI={};
function statsDonnees(){
  const R=S.rows[T_STATS]||[],P=v=>{try{const x=JSON.parse(v||'[]');return Array.isArray(x)?x:[]}catch(e){return[]}};
  const F=[],C=[],A=[],D=[];let maj='';const mois=[];
  for(const r of R){const m=txt(r.Mois);if(/^\d{4}-\d{2}$/.test(m))mois.push(m);
    P(r.Factures).forEach(x=>F.push({num:x[0],date:x[1],cid:x[2],cli:x[3],aff:x[4],cnom:x[5],ht:+x[6]||0,ttc:+x[7]||0,reste:+x[8]||0,ech:x[9],paye:x[10],com:x[11],id:x[12]}));
    P(r.Commandes).forEach(x=>C.push({aff:x[0],nom:x[1],date:x[2],cid:x[3],cli:x[4],ht:+x[5]||0,livr:x[6],nbf:x[7],id:x[8]}));
    P(r.Achats).forEach(x=>A.push({aff:x[0],titre:x[1],date:x[2],four:x[3],ht:+x[4]||0,id:x[5]}));
    P(r['Dépenses']).forEach(x=>D.push({date:x[0],four:x[1],ref:x[2],ht:+x[3]||0,cat:x[4]||'Autres',payee:!!x[5],id:x[6]}));
    const u=r['Mis à jour le'];if(u&&u>maj)maj=u}
  mois.sort();
  // affaires
  const AF={};const af=k=>AF[k]||(AF[k]={aff:k,cid:null,cli:'',noms:new Set(),ca:0,cde:0,dateCde:'',achats:0,fours:new Map(),nbf:0,derF:''});
  for(const f of F){const a=af(f.aff||'(sans commande)');a.ca+=f.ht;a.nbf++;if(!a.cid){a.cid=f.cid;a.cli=f.cli}if(f.cnom)a.noms.add(f.cnom);if(f.date>a.derF)a.derF=f.date}
  for(const c of C){const a=af(c.aff);a.cde+=c.ht;if(!a.cid){a.cid=c.cid;a.cli=c.cli}if(!a.dateCde||c.date<a.dateCde)a.dateCde=c.date;if(c.nom)a.noms.add(c.nom)}
  for(const x of A){const a=af(x.aff);a.achats+=x.ht;a.fours.set(x.four,(a.fours.get(x.four)||0)+x.ht)}
  for(const a of Object.values(AF)){const base=Math.max(a.cde,a.ca);a.taux=base>0?a.achats/base:0;a.marge=a.ca-a.ca*a.taux;
    a.resteAF=a.cde>0?Math.max(0,a.cde-a.ca):0}
  return{F,C,A,D,mois,maj,AF};
}
function statsPeriode(X){const ms=X.mois;let du=STV.du&&ms.includes(STV.du)?STV.du:ms[0]||'',au=STV.au&&ms.includes(STV.au)?STV.au:ms[ms.length-1]||'';if(du>au)[du,au]=[au,du];
  const dans=d=>{const m=String(d||'').slice(0,7);return m>=du&&m<=au};return{du,au,dans}}
function statsClients(){const M={};for(const r of S.rows[MODS.clients.t]||[]){const id=+r['ID Axonaut'];if(id)M[id]=r}return M}
function statsTable(id,cols,rows,opt={}){
  const st=STRI[id]||(STRI[id]={k:opt.tri||cols[0].k,d:opt.desc===false?1:-1});
  const L=[...rows].sort((a,b)=>{const x=a[st.k],y=b[st.k];return(typeof x==='number'||typeof y==='number'?((+x||0)-(+y||0)):String(x??'').localeCompare(String(y??''),'fr'))*st.d});
  const lim=opt.lim&&!opt.tout?opt.lim:Infinity;
  let h=`<div class="tw"><table class="l" id="${id}"><thead><tr>${cols.map(c=>`<th class="${c.n?'n':''}" data-k="${c.k}" title="${esc(c.t||'')}">${esc(c.l)}${st.k===c.k?(st.d>0?' ▲':' ▼'):''}</th>`).join('')}</tr></thead><tbody>`;
  h+=L.slice(0,lim).map(r=>`<tr ${opt.lien?`data-h="${esc(opt.lien(r)||'')}"`:''} ${r._cl?`class="${r._cl}"`:''}>${cols.map(c=>`<td class="${c.n?'n':''}${c.p?' prim':''}" ${c.s?`style="${c.s(r)}"`:''}>${c.f?c.f(r[c.k],r):esc(r[c.k]??'')}</td>`).join('')}</tr>`).join('');

  if(opt.total)h+=`<tfoot><tr>${cols.map((c,i)=>`<td class="${c.n?'n':''}">${i===0?'Total':c.tot?c.tot(L):''}</td>`).join('')}</tr></tfoot>`;

function grapheStats(ms,series,opt={}){
  // series : [{n:'CA', v:[...], c:couleur, type:'barre'|'ligne'}]
  const W=760,H=210,G=44,b=(W-G)/Math.max(ms.length,1),barres=series.filter(s=>s.type!=='ligne');
  const max=Math.max(1,...series.flatMap(s=>s.v)),min=Math.min(0,...series.flatMap(s=>s.v));
  const y=v=>H-(v-min)/(max-min)*H*.92;
  let s=`<svg viewBox="0 0 ${W} ${H+44}" role="img">`;
  for(let i=0;i<=4;i++){const v=min+(max-min)/0.92*i/4*0.92;const Y=y(v);s+=`<line x1="${G}" x2="${W}" y1="${Y}" y2="${Y}" stroke="#EEF0F4"/><text x="${G-6}" y="${Y+4}" text-anchor="end" font-size="10" fill="#8A93A6">${Math.abs(v)>=1000?Math.round(v/1000)+'k':Math.round(v)}</text>`}
  if(min<0)s+=`<line x1="${G}" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="#C9CFDA"/>`;
  ms.forEach((m,i)=>{const X0=G+i*b,bw=b*.72/Math.max(barres.length,1);
    barres.forEach((se,j)=>{const v=se.v[i]||0,y1=y(Math.max(v,0)),y2=y(Math.min(v,0));
      s+=`<rect x="${X0+b*.14+j*bw}" y="${y1}" width="${bw-1}" height="${Math.max(y2-y1,1)}" rx="3" fill="${se.c}"><title>${MOIS_LONG(m)} – ${se.n} : ${eur(v)}</title></rect>`});
    s+=`<text x="${X0+b/2}" y="${H+16}" text-anchor="middle" font-size="11" fill="#6B7385">${MOIS_COURT(m)}</text>`});
  series.filter(se=>se.type==='ligne').forEach(se=>{const pts=ms.map((m,i)=>`${G+i*b+b/2},${y(se.v[i]||0)}`);
    s+=`<polyline points="${pts.join(' ')}" fill="none" stroke="${se.c}" stroke-width="2.2"/>`+ms.map((m,i)=>`<circle cx="${G+i*b+b/2}" cy="${y(se.v[i]||0)}" r="3.5" fill="${se.c}"><title>${MOIS_LONG(m)} – ${se.n} : ${eur(se.v[i])}</title></circle>`).join('')});
  s+=`<g font-size="11.5" fill="#4A5366">${series.map((se,i)=>`<rect x="${G+i*150}" y="${H+28}" width="11" height="11" rx="2" fill="${se.c}"/><text x="${G+i*150+16}" y="${H+38}">${esc(se.n)}</text>`).join('')}</g>`;
  return s+'</svg>';
}

/* « 3+5+6 pcs » : une quantité par ligne. Source : lignes de synthèse liées à la tâche ;
   pour une expédition, lignes du devis de la commande ; sinon la quantité en tête des notes. */
function piecesTache(r,cde,SY,DV,LD){
  const ord=(a,b)=>(+a.Ordre||0)-(+b.Ordre||0)||a.id-b.id;
  let q=ids(r['Synthèse commande']).map(i=>SY.get(i)).filter(x=>x&&!/annul/i.test(txt(x.Statut))).sort(ord).map(x=>+x['Qté attribuée']||+x['Quantité']||0);
  if(!q.length&&/exp[ée]di|livr/i.test(txt(r['Type de tâche'])+' '+txt(r['Libellé']))){
    const dv=cde.flatMap(c=>ids(c.Devis)).map(i=>DV.get(i)).filter(Boolean);
    q=dv.flatMap(d=>ids(d['Lignes de devis'])).map(i=>LD.get(i)).filter(Boolean).sort(ord).map(x=>+x['Quantité']||0)}
  if(!q.length){const mt=String(txt(r.Notes)).match(/^\s*(\d+(?:[.,]\d+)?)\s*(?:x|×)?\s*[A-Za-zÀ-ÿ]/);if(mt)q=[+mt[1].replace(',','.')]}
  q=q.filter(x=>x>0);if(!q.length)return'';
  const tot=q.reduce((a,b)=>a+b,0),u=tot>1?'pcs':'pc';
  return q.length>8?`${q.length} lignes · ${nb(tot)} ${u}`:`${q.map(nb).join('+')} ${u}`}

function filtrer(k){
  enrichir(k);
  // une recherche ou un filtre de colonne retrouve aussi les éléments masqués (ex. devis acceptés / refusés)
  const recherche=!!(etat(k).q.trim()||nbCf(etat(k)));
  const m=MODS[k],E=etat(k),R=S.rows[m.t]||[],sc=sch(m.t),q=norm(E.q).split(/\s+/).filter(Boolean);
  return R.filter(r=>{
    const st=m.statut?txt(r[m.statut]):'';
    if(E.st.length&&!E.st.includes(st))return false;
    if(!E.st.length&&!E.tout&&!recherche&&m.cacheStatuts?.includes(st))return false;
    if(E.retard&&!(tacheOuverte(r)&&r[m.date]&&r[m.date]<auj()))return false;
    if(E.encours&&!devisEnCours(r))return false;
    if(E.ref&&m.ref&&!ids(r[m.ref]).includes(+E.ref))return false;
    if(q.length){const s=norm(Object.values(r).map(txt).join(' '));if(!q.every(w=>s.includes(w)))return false}
    for(const [c,v] of Object.entries(E.cf||{})){if(!v||!sc.par[c])continue;const f=sc.par[c];
      if(estChoix(f)){if(!valsChoix(f,r[c]).includes(v))return false}
      else if(!norm(txtFiltre(r[c])).includes(norm(v)))return false}
    return true});

function txtFiltre(x){const t=txt(x);return /^\d{4}-\d{2}-\d{2}/.test(t)?t+' '+dfr(t.slice(0,10)):t}
const nbCf=E=>Object.values(E.cf||{}).filter(Boolean).length;
function colonnes(k){enrichir(k);const m=MODS[k],sc=sch(m.t);let c=m.cols.filter(n=>sc.par[n]&&!masque(n));if(c.length<2)c=sc.fields.slice(0,7).map(f=>f.name);if(!m.sansPrim&&!c.includes(sc.prim))c.unshift(sc.prim);return c.filter(n=>!masque(n))}
function trier(k,L){
  const m=MODS[k],E=etat(k),sc=sch(m.t);
  let f=E.tri?.f,dir=E.tri?.d||1;
  if(!f){if(m.num&&sc.par[m.num]){f=m.num;dir=-1}else if(m.date&&sc.par[m.date]){f=m.date;dir=k==='taches'?1:-1}else if(m.ordre&&sc.par[m.ordre]){f=m.ordre}else f=sc.prim}
  const F=sc.par[f];
  return L.map(r=>[triVal(F,r[f]),r]).sort((a,b)=>a[0]==null?1:b[0]==null?-1:(a[0]<b[0]?-dir:a[0]>b[0]?dir:0)).map(x=>x[1]);
}

  const neuf=!peutEcrire(k)?'':k==='bl'?`<button class="btn p" onclick="nouveauBL()">${ico('plus')}Nouveau BL</button>`:m.editeur||k==='commandes'?`<a class="btn p" href="${EDITEUR}" target="_blank" title="${k==='commandes'?'Une commande se crée depuis le devis (bouton « Commande reçue » de l’éditeur)':'Numérotation et mise en page dans l’éditeur'}">${ico('plus')}${k==='commandes'?'Commande reçue (éditeur)':nouv(m)}</a>`:`<a class="btn p" href="#/${k}/nouveau">${ico('plus')}${nouv(m)}</a>`;
  const refs=S.rows[MODS.referents.t]||[];
  let h=`<div class="entete"><h1>${m.nom}</h1><span class="sous">${L.length} sur ${R.length}</span><div class="act">
    <button class="btn" onclick="exporter('${k}')">${ico('dl')}Export CSV</button>${neuf}</div></div>
  <div class="card"><div class="outils">
    <div class="rech">${ico('loupe')}<input id="lq" placeholder="Filtrer…" value="${esc(E.q)}"></div>
    ${nbCf(E)?`<button class="puce on" data-cfclear title="Effacer les filtres de colonnes">${nbCf(E)} filtre(s) de colonne ✕</button>`:''}
    ${m.ref&&sc.par[m.ref]?`<select id="lref"><option value="">Tous les référents</option>${MOI?`<option value="${MOI}">Moi</option>`:''}${refs.map(r=>`<option value="${r.id}">${esc(titre(MODS.referents.t,r))}</option>`).join('')}</select>`:''}
    ${opts.length?`<div class="puces"><button class="puce ${!E.st.length&&!E.retard&&!E.encours?'on':''}" data-s="">${m.cacheStatuts?.length&&!E.tout&&!(E.q.trim()||nbCf(E))?'En cours':'Tous'}</button>${E.retard?'<button class="puce on" data-s="">En retard ✕</button>':''}${E.encours?'<button class="puce on" data-s="">En cours ✕</button>':''}${opts.map(o=>`<button class="puce ${E.st.includes(o.value)?'on':''}" data-s="${esc(o.value)}">${esc(o.value)}<b>${cpt[o.value]||0}</b></button>`).join('')}${m.cacheStatuts?.length?`<button class="puce ${E.tout?'on':''}" data-tout>Afficher ${m.cacheStatuts.join(' / ').toLowerCase()}</button>`:''}</div>`:''}
    ${stF?`<div class="bascule"><button data-v="liste" class="${E.vue==='liste'?'on':''}">${ico('liste')}Liste</button><button data-v="kanban" class="${E.vue==='kanban'?'on':''}">${ico('kanban')}Tableau</button></div>`:''}
  </div>`;
  if(E.vue==='kanban'&&stF){h+=`</div><div style="margin-top:14px">${kanban(k,L,opts)}</div>`}
  else{
    const tot={};cols.forEach(c=>{const f=sc.par[c];if(f&&(f.type==='number'||f.type==='formula'||f.type==='rollup')&&estMonnaie(c))tot[c]=L.reduce((s,r)=>s+(+r[c]||0),0)});
    h+=`<div class="tw"><table class="l"><thead><tr>${cols.map(c=>{const f=sc.par[c],num=f&&(f.type==='number'||f.type==='count'||((f.type==='formula'||f.type==='rollup')&&estMonnaie(c)));return`<th data-c="${esc(c)}" class="${num?'n':''}">${esc(c)} <span class="fl">${E.tri?.f===c?(E.tri.d>0?'▲':'▼'):''}</span></th>`}).join('')}</tr>${ligneFiltres(k,cols)}</thead><tbody>`;

    h+=`</tbody>${Object.keys(tot).length?`<tfoot><tr>${cols.map((c,i)=>`<td class="${c in tot?'n':''}">${c in tot?eur(tot[c]):i===0?'Total':''}</td>`).join('')}</tr></tfoot>`:''}</table></div>`;

      const n=[...document.querySelectorAll('tr.filtres [data-cf]')].find(x=>x.dataset.cf===c);if(n){n.focus();if(n.tagName==='INPUT')n.setSelectionRange(n.value.length,n.value.length)}}});
  document.querySelectorAll('[data-cfclear]').forEach(b=>b.onclick=()=>{E.cf={};sauverEtat();dessinerListe(k)});
  const lq=$('lq');lq.oninput=()=>{E.q=lq.value;E.lim=100;dessinerListe(k);const n=$('lq');n.focus();n.setSelectionRange(n.value.length,n.value.length)};
  if($('lref')){$('lref').value=E.ref;$('lref').onchange=e=>{E.ref=e.target.value;sauverEtat();dessinerListe(k)}}
  document.querySelectorAll('.puce[data-s]').forEach(b=>b.onclick=()=>{const s=b.dataset.s;E.retard=false;E.encours=false;if(!s)E.st=[];else E.st=E.st.includes(s)?E.st.filter(x=>x!==s):[...E.st,s];if(location.hash.includes('?'))history.replaceState(null,'','#/'+k);sauverEtat();dessinerListe(k)});
  document.querySelectorAll('.puce[data-tout]').forEach(b=>b.onclick=()=>{E.tout=!E.tout;sauverEtat();dessinerListe(k)});
  document.querySelectorAll('.bascule button').forEach(b=>b.onclick=()=>{E.vue=b.dataset.v;sauverEtat();dessinerListe(k)});
  document.querySelectorAll('table.l th[data-c]').forEach(th=>th.onclick=()=>{const c=th.dataset.c;E.tri=E.tri?.f===c?{f:c,d:-E.tri.d}:{f:c,d:1};sauverEtat();dessinerListe(k)});
  document.querySelectorAll('table.l tbody tr').forEach(tr=>tr.onclick=()=>location.hash=`#/${k}/${tr.dataset.id}`);
  if($('bPlus'))$('bPlus').onclick=()=>{E.lim+=200;dessinerListe(k)};
  if(E.vue==='kanban'&&peutEcrire(k))brancherKanban(k);
  if(E.vue==='kanban'&&!peutEcrire(k))document.querySelectorAll('.kcard').forEach(c=>{c.draggable=false;c.onclick=()=>location.hash=`#/${k}/${c.dataset.id}`});
  brancherStatuts($('main'),()=>dessinerListe(k));

function ligneFiltres(k,cols){
  const m=MODS[k],E=etat(k),sc=sch(m.t),R=S.rows[m.t]||[];
  return`<tr class="filtres">${cols.map(c=>{const f=sc.par[c],v=(E.cf||{})[c]||'';
    if(estChoix(f)){const cpt=new Map();R.forEach(r=>valsChoix(f,r[c]).forEach(x=>cpt.set(x,(cpt.get(x)||0)+1)));
      let vals=[...cpt.keys()];if(f.type==='single_select'&&f.select_options)vals.sort((a,b)=>{const i=f.select_options.findIndex(o=>o.value===a),j=f.select_options.findIndex(o=>o.value===b);return(i<0?999:i)-(j<0?999:j)});else vals.sort((a,b)=>a==='(vide)'?1:b==='(vide)'?-1:a.localeCompare(b,'fr'));
      if(v&&!cpt.has(v))vals.unshift(v);
      return`<th><select data-cf="${esc(c)}" class="${v?'on':''}"><option value="">Tous</option>${vals.map(x=>`<option value="${esc(x)}" ${x===v?'selected':''}>${esc(x)} (${cpt.get(x)||0})</option>`).join('')}</select></th>`}
    return`<th><input data-cf="${esc(c)}" class="${v?'on':''}" placeholder="Contient…" value="${esc(v)}"></th>`}).join('')}</tr>`;
}
function kanban(k,L,opts){
  const m=MODS[k],sc=sch(m.t),E=etat(k),a=auj();
  const cols=opts.filter(o=>E.st.length?E.st.includes(o.value):E.tout||!m.cacheStatuts?.includes(o.value));
  const sec=m.cols.filter(c=>c!==sc.prim&&c!==m.statut&&sc.par[c]).slice(0,3);
  return`<div class="kanban">${cols.map(o=>{const [bg,fg]=coul(o.color);const C=L.filter(r=>r[m.statut]?.id===o.id||txt(r[m.statut])===o.value);
    return`<div class="kcol" data-o="${o.id}" data-v="${esc(o.value)}"><h3><span class="badge" style="background:${bg};color:${fg}">${esc(o.value)}</span><span class="nb">${C.length}</span></h3>
    ${C.slice(0,150).map(r=>{const d=m.date&&r[m.date];return`<div class="kcard" draggable="true" data-id="${r.id}" style="border-left-color:${fg}"><div class="t">${esc(titre(m.t,r))}</div><div class="m">${sec.map(c=>{const v=r[c];if(v==null||v===''||(Array.isArray(v)&&!v.length))return'';const f=sc.par[c];return`<span class="${c===m.date&&v<a&&tacheOuverte(r)?'retard':''}">${f.type==='date'?'📅 '+dfr(v):esc(txt(v)).slice(0,40)}</span>`}).join('')}${d&&!sec.includes(m.date)?`<span class="${d<a&&tacheOuverte(r)?'retard':''}">📅 ${dfr(d)}</span>`:''}</div></div>`}).join('')}</div>`}).join('')}</div>`;
}
function brancherKanban(k){
  const m=MODS[k];let drag=null;
  document.querySelectorAll('.kcard').forEach(c=>{c.ondragstart=e=>{drag=c.dataset.id;e.dataTransfer.effectAllowed='move'};c.onclick=()=>location.hash=`#/${k}/${c.dataset.id}`});
  document.querySelectorAll('.kcol').forEach(col=>{
    col.ondragover=e=>{e.preventDefault();col.classList.add('over')};col.ondragleave=()=>col.classList.remove('over');
    col.ondrop=async e=>{e.preventDefault();col.classList.remove('over');if(!drag)return;
      const row=S.rows[m.t].find(r=>r.id==drag);if(row[m.statut]?.id==col.dataset.o)return;
      try{await changerStatut(k,row,+col.dataset.o,col.dataset.v);dessinerListe(k)}catch(er){toast('Échec : '+er.message,true)}}});
}
async function changerStatut(k,row,oid,val){
  const m=MODS[k],corps={[m.statut]:oid>0?oid:val};
  if(m.faitLe&&sch(m.t).par[m.faitLe]&&/^fait/i.test(val)&&!row[m.faitLe])corps[m.faitLe]=auj();
  const r=await api(`/rows/table/${m.t}/${row.id}/?user_field_names=true`,{method:'PATCH',body:JSON.stringify(corps)});
  majRow(m.t,r);majCompteurs();toast(`${titre(m.t,r)} → ${val}`);return r;
}
function exporter(k){
  const m=MODS[k],cols=colonnes(k),L=trier(k,filtrer(k));
  const c=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const sc=sch(m.t);
  const csv='﻿'+[cols.map(c).join(';'),...L.map(r=>cols.map(n=>{const v=r[n],f=sc.par[n];if(v&&(f?.type==='date'||f?.type==='created_on'||f?.type==='last_modified'))return c(f.date_include_time||f.type!=='date'?frDateHeure(v):frDate(v));return c(typeof v==='string'&&/^-?\d+\.\d+$/.test(v)?v.replace('.',','):txt(v))}).join(';'))].join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`${m.nom}_${auj()}.csv`;a.click();
}

/* ---------- Fiche ---------- */
async function vueFiche(k,id){
  const m=MODS[k];
  if(!S.rows[m.t])chargement();
  await charger(m.t);
  const sc=sch(m.t),nouveau=id==='nouveau';
  let row=nouveau?{}:S.rows[m.t].find(r=>r.id==id);
  if(!row&&!nouveau){row=await api(`/rows/table/${m.t}/${id}/?user_field_names=true`);majRow(m.t,row)}
  SALE={k,t:m.t,id:nouveau?null:row.id,draft:{},row};
  if(nouveau){const p=params();for(const [n,v] of Object.entries(p)){const f=sc.par[n];if(!f)continue;
      if(f.type==='link_row'){const cible=S.rows[f.link_row_table_id]||await charger(f.link_row_table_id).catch(()=>[]);const x=cible.find(r=>r.id==v);SALE.draft[n]=[{id:+v,value:x?titre(f.link_row_table_id,x):'#'+v}]}
      else SALE.draft[n]=v}
    if(m.statut&&sc.par[m.statut]&&!SALE.draft[m.statut]){const o=sc.par[m.statut].select_options?.[0];if(o)SALE.draft[m.statut]=o}
    if(k==='taches'&&MOI&&!SALE.draft['Référent']){const R=S.rows[MODS.referents.t]||[];const me=R.find(r=>r.id===MOI);if(me)SALE.draft['Référent']=[{id:MOI,value:titre(MODS.referents.t,me)}]}
  }
  dessinerFiche();
}
function val(n){return n in SALE.draft?SALE.draft[n]:SALE.row[n]}

    <div class="act">${lienEditeur?`<a class="btn p" href="${lienEditeur}" target="_blank">${ico('ext')}Ouvrir dans l’éditeur</a>`:''}
    ${k==='commandes'&&!nouveau&&peutEcrire('bl')?`<button class="btn p" id="bBL">${ico('bl')}Créer un BL</button>`:''}
    ${devisCde&&peutVoir('devis')?`<a class="btn" href="${EDITEUR}?devis=${encodeURIComponent(devisCde)}" target="_blank">${ico('ext')}Devis / ARC dans l’éditeur</a>`:''}
    ${!nouveau&&m.editeur!=='devis'&&k!=='referents'?'':''}
    ${!nouveau&&estAdmin()?`<a class="btn" href="https://baserow.io/database/592007/table/${t}/row/${row.id}" target="_blank" title="Ouvrir la ligne dans Baserow">Baserow ↗</a>`:''}</div></div>
  <div class="fiche"><div>
   <div class="card">${ecr?`<div class="form">${ed.map(f=>champ(f)).join('')}</div>`:''}
   ${ro.length&&!nouveau?(()=>{const bloc=`<div class="form">${ro.map(f=>`<div class="ch ${f.type==='file'||f.type==='long_text'||String(txt(row[f.name])).length>60?'plein':''}"><label>${esc(f.name)}</label><div class="ro">${rendu(f,row[f.name])}</div></div>`).join('')}</div>`;return ecr?`<details class="calc"><summary>Champs calculés et pièces jointes (${ro.length})</summary>${bloc}</details>`:bloc})():''}
   </div>
   ${!nouveau&&m.liees?`<div class="card" style="margin-top:16px" id="liees"></div>`:''}
  </div><div class="cote">${cote(k,row,nouveau)}</div></div>`;
  $('main').innerHTML=h;

  if($('selSt'))$('selSt').onchange=async e=>{const o=stF.select_options.find(x=>x.id==e.target.value);try{const r=await changerStatut(k,SALE.row,o.id,o.value);SALE.row=r;delete SALE.draft[m.statut];dessinerFiche()}catch(er){toast('Échec : '+er.message,true)}};

function cote(k,row,nouveau){
  if(nouveau)return`<div class="card"><h3>Création</h3><div class="c mut">Renseignez les champs puis « Enregistrer ».${MODS[k].requis?'<br><br>Obligatoires : '+MODS[k].requis.join(', ')+'.':''}</div></div>`;
  const liens=[];
  for(const [n,v] of Object.entries(row)){if(k==='commandes'&&/pdf|excel/i.test(n))continue;if(typeof v==='string'&&/^https?:\/\//.test(v)){const lab=/sharepoint|dossier/i.test(n)?['dossier',n]:/pdf/i.test(n)?['pdf',n]:['ext',n];liens.push(`<a class="lien" href="${esc(v)}" target="_blank">${ico(lab[0])}${esc(lab[1])}</a>`)}}
  let h=k==='commandes'?`<div class="card"><h3>Documents de l’affaire</h3><div id="docsAff"><div class="c mut">Recherche des documents…</div></div></div>`:'';
  h+=liens.length?`<div class="card"><h3>${k==='commandes'?'Liens':'Documents et liens'}</h3>${liens.join('')}</div>`:'';
  if(k==='clients'){const D=(S.rows[MODS.devis.t]||[]).filter(r=>ids(r.Client).includes(row.id)),C=(S.rows[MODS.commandes.t]||[]).filter(r=>ids(r.Client).includes(row.id));
    if(montants())h+=`<div class="card"><h3>Synthèse client</h3><div class="c">${D.length} devis · ${C.length} commande(s)<br>Commandé total : <b>${eur(C.filter(r=>txt(r.Statut)!=='Annulée').reduce((s,r)=>s+(+r['Montant HT (€)']||0),0))}</b> HT<br>Devis en cours : <b>${eur(D.filter(devisEnCours).reduce((s,r)=>s+(+r['Total HT']||0),0))}</b> HT</div></div>`;
    charger(MODS.devis.t).then(()=>charger(MODS.commandes.t)).catch(()=>{});}
  if(k==='commandes'){const T=(S.rows[MODS.taches.t]||[]).filter(r=>ids(r.Commande).includes(row.id)&&!/annul/i.test(txt(r.Statut)));

function ouvrirModal(t,c,p){$('mTitre').textContent=t;$('mCorps').innerHTML=c;$('mPied').innerHTML=p;$('modal').style.display='flex'}

/* ---------- Recherche globale ---------- */
const GMODS0=['devis','commandes','clients','taches','cf','fournisseurs','arc','bl'];
let GMODS=GMODS0;
let gsel=0;
$('gq').oninput=async()=>{
  const q=norm($('gq').value).split(/\s+/).filter(Boolean),box=$('gres');
  if(!q.length){box.style.display='none';return}
  GMODS.forEach(k=>charger(MODS[k].t).catch(()=>{}));
  const res=[];
  for(const k of GMODS){const m=MODS[k],R=S.rows[m.t];if(!R)continue;
    for(const r of R){const s=norm(Object.values(r).map(txt).join(' '));if(q.every(w=>s.includes(w))){res.push([k,r]);if(res.filter(x=>x[0]===k).length>=6)break}}}
  gsel=0;
  box.innerHTML=res.slice(0,30).map(([k,r],i)=>{const m=MODS[k],sc=sch(m.t),sec=m.cols.filter(c=>c!==sc.prim&&sc.par[c]).slice(0,2);
    return`<a href="#/${k}/${r.id}" class="${i===0?'sel':''}"><span class="ty">${m.nom}</span><span><b>${esc(titre(m.t,r))}</b> <span class="mut">${sec.map(c=>esc(txt(r[c]))).filter(Boolean).join(' · ')}</span></span></a>`}).join('')||'<div class="vide" style="padding:16px">Aucun résultat</div>';
  box.style.display='block';
};
$('gq').onkeydown=e=>{const L=[...$('gres').querySelectorAll('a')];
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();gsel=Math.max(0,Math.min(L.length-1,gsel+(e.key==='ArrowDown'?1:-1)));L.forEach((a,i)=>a.classList.toggle('sel',i===gsel))}
  if(e.key==='Enter'&&L[gsel]){location.hash=L[gsel].getAttribute('href');fermerG()}
  if(e.key==='Escape')fermerG()};
$('gres').onclick=()=>setTimeout(fermerG,0);
document.addEventListener('click',e=>{if(!e.target.closest('#gsearch'))$('gres').style.display='none'});
function fermerG(){$('gres').style.display='none';$('gq').value='';$('gq').blur()}
document.addEventListener('keydown',e=>{if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();$('gq').focus()}
  if((e.metaKey||e.ctrlKey)&&e.key==='s'&&SALE&&(Object.keys(SALE.draft).length||!SALE.id)){e.preventDefault();$('beEnr').click()}});
window.addEventListener('beforeunload',e=>{if(SALE&&Object.keys(SALE.draft).length){e.preventDefault();e.returnValue=''}});
$('bRafr').onclick=async()=>{for(const t in S.prom)delete S.prom[t];toast('Données rechargées');await route()};

/* ---------- Comptes : fichier akteev-acces.json (jetons chiffrés, publiable) ----------
   Chaque utilisateur : {login, nom, profil, referent, iter, sel, iv, jeton} ; jeton = jeton Baserow du profil chiffré
   AES-GCM avec une clé PBKDF2-SHA256 (600 000 itérations) tirée de son mot de passe. Aucun secret en clair. */
let ACCES=null;
const FICHIER_ACCES='akteev-acces.json';
async function lireAcces(){try{const r=await fetch(FICHIER_ACCES+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)return null;return await r.json()}catch(e){return null}}
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
const deb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const normLogin=s=>norm(s).trim().replace(/\s+/g,'.');
async function cle(mdp,sel,iter){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(mdp),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:sel,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function chiffrer(jeton,mdp){const sel=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),iter=600000;
  const c=await crypto.subtle.encrypt({name:'AES-GCM',iv},await cle(mdp,sel,iter),new TextEncoder().encode(jeton));return{iter,sel:b64(sel),iv:b64(iv),jeton:b64(c)}}
async function dechiffrer(u,mdp){const c=await crypto.subtle.decrypt({name:'AES-GCM',iv:deb64(u.iv)},await cle(mdp,deb64(u.sel),u.iter||600000),deb64(u.jeton));return new TextDecoder().decode(c)}
async function testerJeton(j){const r=await fetch(API+`/rows/table/${MODS.taches.t}/?user_field_names=true&size=1`,{headers:{Authorization:'Token '+j}});if(!r.ok)throw new Error('jeton refusé par Baserow ('+r.status+')')}
function ecranConnexion(){
  document.body.classList.add('deconnecte');
  $('main').innerHTML=`<div class="card" id="cfg"><div class="marque" style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><span style="display:grid;place-items:center;width:34px;height:34px;border-radius:8px;background:var(--accent);color:#fff;font-weight:700">A</span><h1>Akteev</h1></div>
   <p class="mut">Connexion à l’interface de gestion KTE.</p>
   <label>Identifiant</label><input id="cxL" autocomplete="username" autocapitalize="none">
   <label>Mot de passe</label><input id="cxM" type="password" autocomplete="current-password">
   <button class="btn p" id="cxOk" style="margin-top:16px;width:100%;justify-content:center">Se connecter</button>
   <p style="margin-top:18px;font-size:12px"><a href="#" id="cxJ">Connexion avec un jeton Baserow (administrateur)</a></p></div>`;
  const go=async()=>{const l=normLogin($('cxL').value),m=$('cxM').value;if(!l||!m)return;
    const u=(ACCES?.utilisateurs||[]).find(x=>x.login===l);$('cxOk').disabled=true;$('cxOk').textContent='Vérification…';
    try{if(!u)throw new Error('x');let j;try{j=await dechiffrer(u,m)}catch(e){throw new Error('x')}
      await testerJeton(j);
      JETON=j;SESSION={login:u.login,nom:u.nom,profil:u.profil,referent:u.referent||null};
      try{localStorage.setItem(CLE,j);localStorage.setItem('akteev_session',JSON.stringify(SESSION))}catch(e){}
      MOI=SESSION.referent||MOI;ls.set('moi',MOI);$('toast').innerHTML='';for(const t in S.prom)delete S.prom[t];location.hash='#/accueil';lancer()}
    catch(e){toast(e.message==='x'?'Identifiant ou mot de passe incorrect':'Connexion impossible : '+e.message,true);$('cxOk').disabled=false;$('cxOk').textContent='Se connecter'}};
  $('cxOk').onclick=go;$('cxM').onkeydown=e=>{if(e.key==='Enter')go()};$('cxL').focus();
  $('cxJ').onclick=e=>{e.preventDefault();config()};
}
function deconnecter(){
  if(SALE&&Object.keys(SALE.draft).length&&!confirm('Des modifications ne sont pas enregistrées. Se déconnecter quand même ?'))return;
  try{localStorage.removeItem(CLE);localStorage.removeItem('akteev_session')}catch(e){}
  location.href=location.pathname;
}
/* ---------- Page Utilisateurs (administrateur) ---------- */
let BROUILLON_ACCES=null;
const DROITS=[
 ['Direction / Admin','Votre jeton actuel : tout (lecture, création, modification).'],
 ['Commercial / ADV','Lecture : toutes les tables. Création + modification : Devis, Lignes de devis, Commandes, ARC, Lignes ARC, BL, Lignes BL, Clients, Tâches commande. Suppression : Lignes de devis, Lignes ARC, Lignes BL (l’éditeur supprime des lignes).'],
 ['Atelier','Lecture : Tâches commande, Synthèse commande, Commandes, Clients, Référents, Tâches (catalogue). Modification : Tâches commande, Synthèse commande. Rien d’autre (pas Devis : les prix restent invisibles).'],
 ['Achats','Lecture : Commandes, Clients, Tâches commande, Synthèse commande, Référents, Fournisseurs, Commandes fournisseurs, Lignes commande fournisseur, Tâches (catalogue). Création + modification : Commandes fournisseurs, Lignes commande fournisseur, Fournisseurs, Synthèse commande ; modification : Tâches commande.']];
async function vueUtilisateurs(){
  document.title='Akteev – Utilisateurs';
  if(!BROUILLON_ACCES)BROUILLON_ACCES=JSON.parse(JSON.stringify(ACCES||{version:1,utilisateurs:[]}));
  const A=BROUILLON_ACCES,modif=JSON.stringify(A)!==JSON.stringify(ACCES||{version:1,utilisateurs:[]});
  const refs=await charger(MODS.referents.t).catch(()=>[]);
  const nomRef=id=>txt(refs.find(r=>r.id===id)?.[sch(MODS.referents.t).prim])||'';
  $('main').innerHTML=`<div class="entete"><h1>Utilisateurs</h1><span class="sous">${A.utilisateurs.length} compte(s)</span></div>
  ${modif?`<div class="card" style="border-color:#F5D58A;background:#FFFBEB;margin-bottom:16px"><div style="padding:14px 16px"><b>Modifications à publier.</b> Elles ne prennent effet qu’une fois le fichier <code>${FICHIER_ACCES}</code> publié dans le dépôt GitHub de l’éditeur (ou demandez à Claude de le publier).
   <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn p" id="uCopie">Copier le fichier</button><button class="btn" id="uDl">${ico('dl')}Télécharger</button><a class="btn" target="_blank" href="https://github.com/MatthiasKTE/editeur/${ACCES?'edit':'new'}/main${ACCES?'/'+FICHIER_ACCES:'?filename='+FICHIER_ACCES}">${ico('ext')}Ouvrir sur GitHub</a><button class="btn d" id="uAnn">Annuler les modifications</button></div></div></div>`:''}
  <div class="card"><div class="tw"><table class="l"><thead><tr><th>Identifiant</th><th>Nom</th><th>Profil</th><th>Référent</th><th></th></tr></thead><tbody>
  ${A.utilisateurs.map((u,i)=>`<tr style="cursor:default"><td class="prim">${esc(u.login)}</td><td>${esc(u.nom)}</td><td>${esc(PROFILS[u.profil]?.nom||u.profil)}</td><td>${esc(nomRef(u.referent))||'<span class="mut">—</span>'}</td><td style="text-align:right;white-space:nowrap"><button class="btn" data-mdp="${i}">Nouveau mot de passe</button> <button class="btn d" data-ret="${i}">Retirer</button></td></tr>`).join('')||'<tr><td colspan="5" class="vide">Aucun compte. Créez d’abord le vôtre (profil Direction / Admin).</td></tr>'}
  </tbody></table></div></div>
  <div class="card" style="margin-top:16px"><h2 style="font-size:14.5px;margin:0;padding:14px 16px;border-bottom:1px solid var(--trait)" id="uTitre">Ajouter un utilisateur</h2>
   <div class="formU"><div><label>Identifiant</label><input id="uL" placeholder="ex. elodie" autocapitalize="none"></div><div><label>Nom affiché</label><input id="uN" placeholder="Elodie Xiang"></div>
    <div><label>Profil</label><select id="uP">${Object.entries(PROFILS).map(([k,p])=>`<option value="${k}">${p.nom}</option>`).join('')}</select></div>
    <div><label>Référent (pour « Mes tâches »)</label><select id="uR"><option value="">—</option>${refs.map(r=>`<option value="${r.id}">${esc(titre(MODS.referents.t,r))}</option>`).join('')}</select></div>
    <div><label>Mot de passe (10 caractères min.)</label><input id="uM" type="password" autocomplete="new-password"></div><div><label>Confirmation</label><input id="uM2" type="password" autocomplete="new-password"></div>
    <div style="grid-column:1/-1"><label>Jeton Baserow du profil (créé dans Baserow › Paramètres › Jetons de base de données, droits ci-dessous)</label><input id="uJ" type="password" autocomplete="off" placeholder="Il sera chiffré avec le mot de passe ; il n’est jamais affiché ni enregistré en clair"></div>
    <div style="grid-column:1/-1;display:flex;gap:8px"><button class="btn p" id="uOk">Ajouter</button><button class="btn" id="uRaz" style="display:none">Annuler</button></div></div></div>
  <div class="card droits" style="margin-top:16px"><h2 style="font-size:14.5px;margin:0;padding:14px 16px;border-bottom:1px solid var(--trait)">Droits à donner au jeton Baserow de chaque profil</h2>
   <table class="l"><tbody>${DROITS.map(d=>`<tr style="cursor:default"><td class="prim" style="width:170px">${d[0]}</td><td style="white-space:normal;max-width:none">${d[1]}</td></tr>`).join('')}</tbody></table>
   <div class="c mut" style="padding:12px 16px;font-size:12.5px">Un jeton par profil suffit (tous les utilisateurs d’un profil partagent le même jeton, chiffré avec le mot de passe de chacun). Pour couper l’accès à quelqu’un : le retirer ici, publier, puis régénérer le jeton de son profil dans Baserow et redonner un mot de passe aux autres membres du profil.</div></div>`;
  let edite=null;
  const raz=()=>{edite=null;['uL','uN','uM','uM2','uJ'].forEach(i=>$(i).value='');$('uR').value='';$('uL').disabled=false;$('uTitre').textContent='Ajouter un utilisateur';$('uOk').textContent='Ajouter';$('uRaz').style.display='none'};
  $('uRaz').onclick=raz;
  document.querySelectorAll('[data-mdp]').forEach(b=>b.onclick=()=>{const u=A.utilisateurs[+b.dataset.mdp];edite=u.login;$('uL').value=u.login;$('uL').disabled=true;$('uN').value=u.nom;$('uP').value=u.profil;$('uR').value=u.referent||'';$('uTitre').textContent='Nouveau mot de passe pour '+u.login;$('uOk').textContent='Enregistrer';$('uRaz').style.display='';$('uM').focus()});
  document.querySelectorAll('[data-ret]').forEach(b=>b.onclick=()=>{const u=A.utilisateurs[+b.dataset.ret];if(confirm(`Retirer ${u.nom} (${u.login}) ?`)){A.utilisateurs.splice(+b.dataset.ret,1);vueUtilisateurs()}});
  $('uOk').onclick=async()=>{const l=normLogin($('uL').value),n=$('uN').value.trim(),p=$('uP').value,ref=+$('uR').value||null,m=$('uM').value,j=$('uJ').value.trim();
    if(!l||!n)return toast('Identifiant et nom obligatoires',true);
    if(!edite&&A.utilisateurs.some(u=>u.login===l))return toast('Cet identifiant existe déjà',true);
    if(m.length<10)return toast('Mot de passe : 10 caractères minimum',true);if(m!==$('uM2').value)return toast('Les deux mots de passe sont différents',true);
    if(!j)return toast('Collez le jeton Baserow du profil',true);
    $('uOk').disabled=true;$('uOk').textContent='Chiffrement…';
    try{await testerJeton(j);const c=await chiffrer(j,m);const u={login:l,nom:n,profil:p,referent:ref,...c};
      const i=A.utilisateurs.findIndex(x=>x.login===l);if(i>=0)A.utilisateurs[i]=u;else A.utilisateurs.push(u);
      A.maj=auj();toast(edite?'Mot de passe changé (à publier)':'Utilisateur ajouté (à publier)');vueUtilisateurs()}
    catch(e){toast('Échec : '+e.message,true);$('uOk').disabled=false;$('uOk').textContent=edite?'Enregistrer':'Ajouter'}};
  const contenu=()=>JSON.stringify(A,null,1)+'\n';
  if($('uCopie'))$('uCopie').onclick=async()=>{try{await navigator.clipboard.writeText(contenu());toast('Fichier copié : collez-le sur GitHub puis « Commit changes »')}catch(e){toast('Copie impossible : utilisez Télécharger',true)}};
  if($('uDl'))$('uDl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([contenu()],{type:'application/json'}));a.download=FICHIER_ACCES;a.click()};
  if($('uAnn'))$('uAnn').onclick=()=>{BROUILLON_ACCES=null;vueUtilisateurs()};
}

/* ---------- Jeton ---------- */
function config(change){
  $('main').innerHTML=`<div class="card" id="cfg"><h1>Connexion à Baserow</h1><p class="mut">Collez le jeton Baserow (le même que celui de l’éditeur). Il reste enregistré dans ce navigateur uniquement.</p>
   <input id="cfgJ" type="password" placeholder="Jeton de base de données" value="${change&&JETON?esc(JETON):''}"><button class="btn p" id="cfgOk">Se connecter</button></div>`;
  $('cfgOk').onclick=async()=>{const j=$('cfgJ').value.trim();if(!j)return;JETON=j;
    try{await api(`/rows/table/${MODS.referents.t}/?user_field_names=true&size=1`);try{localStorage.setItem(CLE,j);localStorage.removeItem('akteev_session')}catch(e){}SESSION=null;for(const t in S.prom)delete S.prom[t];location.hash='#/accueil';lancer()}
    catch(e){toast('Jeton refusé : '+e.message,true)}};
}

/* ---------- Démarrage ---------- */
function lancer(){
  document.body.classList.remove('deconnecte');GMODS=GMODS0.filter(peutVoir);
  if(SESSION?.referent&&!MOI){MOI=SESSION.referent;ls.set('moi',MOI)}
  dessinerMenu();route();charger(MODS.referents.t).catch(()=>{});
  setTimeout(()=>['devis','commandes','taches'].filter(peutVoir).forEach(k=>charger(MODS[k].t).catch(()=>{})),300)}
(async()=>{
  ACCES=await lireAcces();
  const avecComptes=!!(ACCES&&ACCES.utilisateurs?.length);
  if(JETON&&(SESSION||!avecComptes))return lancer(); // session ouverte, ou jeton administrateur saisi directement
  if(avecComptes)return ecranConnexion();
  document.body.classList.add('deconnecte');config();
})();
</script>
