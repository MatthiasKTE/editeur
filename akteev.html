.btn{border:1px solid var(--trait);background:#fff;border-radius:8px;padding:7px 13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;color:var(--txt);white-space:nowrap}
.btn:hover{background:var(--hover)}

.btn svg{width:15px;height:15px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid #EAEDF2}

.plus{padding:12px;text-align:center}

.kanban{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}

.kcard .t{font-weight:600;font-size:13px;margin-bottom:4px}
.kcard .m{font-size:12px;color:var(--mut);display:flex;gap:8px;flex-wrap:wrap}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:16px}
.kpi{padding:16px 18px;cursor:pointer}
.kpi:hover{box-shadow:0 2px 10px rgba(0,0,0,.1)}
.kpi .lab{color:var(--mut);font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:7px}
.kpi .lab svg{width:16px;height:16px}
.kpi .val{font-size:26px;font-weight:700;margin-top:6px;letter-spacing:-.5px}
.kpi .det{font-size:12.5px;color:var(--mut);margin-top:2px}
.grille{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px}
.bloc h2{font-size:14.5px;margin:0;padding:14px 16px;border-bottom:1px solid var(--trait);display:flex;align-items:center;gap:8px}
.bloc h2 a{margin-left:auto;font-size:12.5px;font-weight:500}
.ligneDb{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid #F0F2F6;cursor:pointer}
.ligneDb:hover{background:var(--hover)}
.ligneDb .x{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ligneDb .x small{color:var(--mut);margin-left:6px}

.fiche{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.form{padding:6px 20px 18px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 22px}
.form .ch{padding:9px 0;border-bottom:1px solid #F0F2F6;min-width:0}
.form .ch.plein{grid-column:1/-1}
.form .ch label{display:block;font-size:12px;color:var(--mut);font-weight:500;margin-bottom:4px}
.form .ch label .req{color:var(--err)}
.form .ch .ro{min-height:22px;word-wrap:break-word;white-space:pre-wrap}
.ed{width:100%;border:1px solid transparent;border-radius:6px;padding:5px 7px;margin-left:-7px;background:transparent;outline:none;min-height:32px}
.ed:hover{border-color:var(--trait);background:#fff}
.ed:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accentL)}
textarea.ed{resize:vertical;min-height:60px}
.ed.modif{background:#FFF8E6;border-color:#F5D58A}
.lienEd{display:flex;flex-wrap:wrap;align-items:center;gap:3px;min-height:32px;padding:4px 0}
.lienEd .chip .x{margin-left:5px;color:var(--mut);cursor:pointer}
.lienEd .chip .x:hover{color:var(--err)}
.lienEd button{border:1px dashed var(--trait);background:#fff;border-radius:5px;padding:1px 8px;color:var(--mut);font-size:12px}
.lienEd button:hover{border-color:var(--accent);color:var(--accent)}
.lienEd.modif{background:#FFF8E6;border-radius:6px}
.section{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);font-weight:600;padding:16px 20px 4px;grid-column:1/-1}
details.calc summary{cursor:pointer;padding:12px 20px;color:var(--mut);font-size:13px;font-weight:500}
.cote .card{margin-bottom:14px}
.cote .card h3{font-size:13px;margin:0;padding:12px 14px;border-bottom:1px solid var(--trait)}
.cote .card .c{padding:10px 14px;font-size:13px}
.cote .lien{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid #F0F2F6;color:var(--txt)}
.cote .lien:hover{background:var(--hover)}
.cote .lien svg{width:16px;height:16px;color:var(--accent)}
.onglets{display:flex;gap:2px;border-bottom:1px solid var(--trait);padding:0 12px;overflow-x:auto}

.onglets button.on{color:var(--accent);border-bottom-color:var(--accent)}
.onglets button .nb{background:#EEF1F6;border-radius:10px;padding:0 6px;font-size:11px;margin-left:4px}
#barreEnr{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(120px);background:var(--side);color:#fff;border-radius:10px;padding:10px 12px 10px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:transform .2s;z-index:40}
#barreEnr.vis{transform:translateX(-50%) translateY(0)}
#barreEnr .btn{border-color:#3A4B6A;background:transparent;color:#fff}
#barreEnr .btn.p{background:var(--accent);border-color:var(--accent)}

.selStatut select{position:absolute;inset:0;opacity:0;cursor:pointer}
/* ---------- Fenêtres ---------- */
#modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:flex-start;justify-content:center;padding-top:8vh;z-index:60}

#modal .box h3 button{margin-left:auto;border:0;background:none;font-size:20px;color:var(--mut)}
#modal .box .corps{padding:14px 18px;overflow:auto;flex:1}
#modal .box .pied{padding:12px 18px;border-top:1px solid var(--trait);display:flex;justify-content:flex-end;gap:8px}
.choixL{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:6px;cursor:pointer}
.choixL:hover{background:var(--hover)}
.choixL small{color:var(--mut)}
#toast{position:fixed;right:20px;bottom:20px;z-index:70;display:flex;flex-direction:column;gap:8px}
#toast div{background:#fff;border-left:4px solid var(--ok);box-shadow:0 6px 20px rgba(0,0,0,.15);border-radius:8px;padding:10px 14px;min-width:240px;max-width:420px;animation:entre .2s}
#toast div.err{border-left-color:var(--err)}
@keyframes entre{from{opacity:0;transform:translateX(20px)}}
.charge{display:flex;align-items:center;gap:10px;color:var(--mut);padding:40px;justify-content:center}
.charge::before{content:"";width:18px;height:18px;border:2px solid var(--trait);border-top-color:var(--accent);border-radius:50%;animation:tourne .8s linear infinite}
@keyframes tourne{to{transform:rotate(360deg)}}
.graph{padding:14px 16px 8px}
.graph svg{width:100%;height:auto;display:block}
#cfg{max-width:480px;margin:10vh auto;padding:28px}
#cfg input{width:100%;border:1px solid var(--trait);border-radius:8px;padding:9px 11px;margin:12px 0}
/* ---------- Écrans étroits ---------- */
@media (max-width:900px){
  #side{position:fixed;left:-240px;z-index:80;transition:left .2s}
  body.menu #side{left:0;box-shadow:0 0 40px rgba(0,0,0,.4)}
  #top .burger{display:block}
  #main{padding:16px}
  .fiche{grid-template-columns:1fr}
  .form{grid-template-columns:1fr}
  .grille{grid-template-columns:1fr}
  .outils .rech input{width:170px}
}
</style>

/* ---------- API Baserow ---------- */
async function api(path,opt={}){
  const r=await fetch(API+path,{...opt,headers:{Authorization:'Token '+JETON,'Content-Type':'application/json',...(opt.headers||{})}});
  if(!r.ok){const t=await r.text();let m=t;try{const j=JSON.parse(t);m=(j.error||'')+' '+(j.detail?JSON.stringify(j.detail):'')}catch(e){}throw new Error(r.status+' '+m.slice(0,300))}
  return r.status===204?null:r.json();
}
const S={sch:{},rows:{},prom:{}};
async function tout(t){let out=[],p=1;for(;;){const j=await api(`/rows/table/${t}/?user_field_names=true&size=200&page=${p}`);out=out.concat(j.results);if(!j.next)break;p++}return out}
async function lireChamps(t){try{return await api(`/fields/table/${t}/`)}catch(e){return null}}
function charger(t,force){
  if(force||!S.prom[t]){
    S.prom[t]=Promise.all([S.sch[t]&&!force?Promise.resolve(null):lireChamps(t),tout(t)]).then(([f,rows])=>{
      S.rows[t]=rows;if(f)S.sch[t]=faireSchema(f,false);else if(!S.sch[t]||S.sch[t].deduit)S.sch[t]=deduireSchema(rows);
      majCompteurs();return rows}).catch(e=>{delete S.prom[t];throw e});
  }
  return S.prom[t];
}
function faireSchema(fields,deduit){
  fields.sort((a,b)=>(b.primary?1:0)-(a.primary?1:0)||(a.order??0)-(b.order??0)||a.id-b.id);
  const par={};fields.forEach(f=>par[f.name]=f);
  return{fields,par,prim:(fields.find(f=>f.primary)||fields[0]||{}).name,deduit};
}
function deduireSchema(rows){
  const noms=[];const vus={};
  rows.forEach(r=>Object.keys(r).forEach(k=>{if(k!=='id'&&k!=='order'&&!vus[k]){vus[k]=1;noms.push(k)}}));
  const fields=noms.map((n,i)=>{
    const vals=rows.map(r=>r[n]).filter(v=>v!=null&&v!==''&&!(Array.isArray(v)&&!v.length));
    const f={id:-(i+1),name:n,order:i,primary:i===0,type:'text'};
    const v=vals[0];
    if(v===undefined){f.type='text'}
    else if(typeof v==='boolean')f.type='boolean';
    else if(Array.isArray(v)){
      if(v[0]&&('url' in v[0])&&('visible_name' in v[0]))f.type='file';
      else if(v[0]&&'color' in v[0]){f.type='multiple_select';f.select_options=optsVues(vals.flat())}
      else if(LIENS_SECOURS[n]&&v[0]&&'id' in v[0]){f.type='link_row';f.link_row_table_id=LIENS_SECOURS[n]}
      else f.type='lookup';
    }
    else if(typeof v==='object'&&'color' in v){f.type='single_select';f.select_options=optsVues(vals)}
    else if(typeof v==='object')f.type='formula';
    else if(vals.every(x=>/^\d{4}-\d{2}-\d{2}$/.test(x)))f.type='date';
    else if(vals.every(x=>/^\d{4}-\d{2}-\d{2}T/.test(x))){f.type='date';f.date_include_time=true}
    else if(vals.every(x=>/^-?\d+(\.\d+)?$/.test(String(x)))){f.type='number';f.number_decimal_places=Math.max(0,...vals.map(x=>(String(x).split('.')[1]||'').length))}
    else if(vals.some(x=>String(x).includes('\n')))f.type='long_text';
    else if(vals.every(x=>/^https?:\/\//.test(x)))f.type='url';
    return f});
  return faireSchema(fields,true);
}
function optsVues(vals){const m=new Map();vals.forEach(o=>{if(o&&o.id!=null&&!m.has(o.id))m.set(o.id,{id:o.id,value:o.value,color:o.color})});return[...m.values()]}
const sch=t=>S.sch[t]||{fields:[],par:{},prim:'id'};
const titre=(t,r)=>{const p=sch(t).prim;const v=r?.[p];return txt(v)||('#'+r?.id)};
function txt(v){if(v==null)return'';if(Array.isArray(v))return v.map(txt).filter(Boolean).join(', ');if(typeof v==='object')return v.value!=null?txt(v.value):(v.name||v.visible_name||'');return String(v)}

/* ---------- Rendu d'une valeur ---------- */
function rendu(f,v,court){
  if(v==null||v===''||(Array.isArray(v)&&!v.length))return'<span class="mut">—</span>';
  const ty=f?.type,n=f?.name||'';
  if(ty==='single_select')return badge(v);
  if(ty==='multiple_select')return v.map(badge).join(' ');
  if(ty==='boolean')return v?'<span style="color:var(--ok)">✔</span>':'<span class="mut">—</span>';
  if(ty==='link_row'){const m=MOD_DE_TABLE[f.link_row_table_id];return v.map(x=>m?`<a class="chip" href="#/${m}/${x.id}" onclick="event.stopPropagation()">${esc(x.value)}</a>`:`<span class="chip">${esc(x.value)}</span>`).join('')}
  if(ty==='file')return v.map(x=>x.is_image?`<a href="${esc(x.url)}" target="_blank" onclick="event.stopPropagation()"><img src="${esc(x.thumbnails?.tiny?.url||x.url)}" style="height:${court?24:60}px;border-radius:4px;margin-right:4px;vertical-align:middle"></a>`:`<a href="${esc(x.url)}" target="_blank">${esc(x.visible_name)}</a>`).join(' ');
  if(ty==='date'||ty==='created_on'||ty==='last_modified')return f.date_include_time||ty!=='date'?esc(dtfr(v)):esc(dfr(v));
  if(ty==='number'||ty==='count'||ty==='rating'||(ty==='formula'&&typeof v!=='object'&&/^-?\d+(\.\d+)?$/.test(String(v)))){return estMonnaie(n)?eur(v):nb(v)}
  if(ty==='url'||(typeof v==='string'&&/^https?:\/\/\S+$/.test(v)))return`<a href="${esc(v)}" target="_blank" onclick="event.stopPropagation()">${court?'Ouvrir ↗':esc(v.length>60?v.slice(0,57)+'…':v)}</a>`;
  if(ty==='email')return`<a href="mailto:${esc(v)}" onclick="event.stopPropagation()">${esc(v)}</a>`;
  if(Array.isArray(v))return v.map(x=>typeof x==='object'&&x&&'color' in x?badge(x):`<span class="chip">${esc(txt(x))}</span>`).join('');
  if(typeof v==='object'&&'color' in v)return badge(v);
  const s=txt(v);
  if(court&&s.length>90)return esc(s.slice(0,88))+'…';
  if(/^\d{4}-\d{2}-\d{2}/.test(s))return esc(s.length>10?dtfr(s):dfr(s));
  return esc(s);
}
function triVal(f,v){
  if(v==null||v==='')return null;const ty=f?.type;
  if(ty==='number'||ty==='count'||(typeof v==='string'&&/^-?\d+(\.\d+)?$/.test(v)))return+v;
  if(typeof v==='object'&&!Array.isArray(v)&&'color' in v){const o=(f?.select_options||[]).findIndex(x=>x.id===v.id);return o>=0?o:norm(v.value)}
  return norm(txt(v));
}

function graphe(C,dateCde){

    s+=`<text x="${X+w/2}" y="${H+16}" text-anchor="middle" font-size="11" fill="#6B7385">${new Date(ms[i]+'-01T00:00').toLocaleDateString('fr-FR',{month:'short'}).replace('.','')}</text>`});

/* ---------- Jeton ---------- */
function config(change){
  $('main').innerHTML=`<div class="card" id="cfg"><h1>Connexion à Baserow</h1><p class="mut">Collez le jeton Baserow (le même que celui de l’éditeur). Il reste enregistré dans ce navigateur uniquement.</p>
   <input id="cfgJ" type="password" placeholder="Jeton de base de données" value="${change&&JETON?esc(JETON):''}"><button class="btn p" id="cfgOk">Se connecter</button></div>`;
  $('cfgOk').onclick=async()=>{const j=$('cfgJ').value.trim();if(!j)return;JETON=j;
    try{await api(`/rows/table/${MODS.referents.t}/?user_field_names=true&size=1`);try{localStorage.setItem(CLE,j)}catch(e){}for(const t in S.prom)delete S.prom[t];location.hash='#/accueil';route()}
    catch(e){toast('Jeton refusé : '+e.message,true)}};
}

/* ---------- Démarrage ---------- */
dessinerMenu();
if(!JETON)config();
else{route();charger(MODS.referents.t).catch(()=>{});setTimeout(()=>['devis','commandes','taches'].forEach(k=>charger(MODS[k].t).catch(()=>{})),300)}
</script>
</body>
</html>
